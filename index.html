@font-face{font-family:"Newsreader";font-style:italic;font-weight:300 400;font-display:swap;src:url(assets/fonts/newsreader-italic.woff2) format("woff2")}
@font-face{font-family:"Newsreader";font-style:normal;font-weight:400;font-display:swap;src:url(assets/fonts/newsreader-roman.woff2) format("woff2")}
:root{
  --sky:#E6F0F3; --haze:#F2F7F8; --ink:#12313D; --ink-soft:rgba(18,49,61,.62);
  --rule:rgba(18,49,61,.22); --veil:rgba(236,245,247,.58); --focus:#0D5470;
  --serif:"Newsreader","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --pad:clamp(20px,4vw,56px);
  --scene:linear-gradient(180deg,#6FB8DE 0%,#7CC0E2 30%,#B6D3E2 37%,#AEC7D7 38%,#9FC0D6 38.3%,#6FA5CA 46%,#3B9EC7 65%,#22AFC3 100%);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky:#071824; --haze:#0B2230; --ink:#D7ECF2; --ink-soft:rgba(215,236,242,.62);
    --rule:rgba(215,236,242,.22); --veil:rgba(4,19,29,.55); --focus:#8FD7E4;
    --scene:linear-gradient(180deg,#071F4A 0%,#0A2A5C 30%,#12395F 37%,#0A3562 38%,#073662 38.3%,#01224C 46%,#00113D 70%,#000F31 100%);
  }
}
:root[data-theme="dark"]{
  --sky:#071824; --haze:#0B2230; --ink:#D7ECF2; --ink-soft:rgba(215,236,242,.62);
  --rule:rgba(215,236,242,.22); --veil:rgba(4,19,29,.55); --focus:#8FD7E4;
  --scene:linear-gradient(180deg,#071F4A 0%,#0A2A5C 30%,#12395F 37%,#0A3562 38%,#073662 38.3%,#01224C 46%,#00113D 70%,#000F31 100%);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;height:100%;overflow:hidden;color:var(--ink);
  background:var(--scene);
  font-family:var(--serif);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
canvas#sea{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
a{color:inherit}
:focus-visible{outline:1.5px solid var(--focus);outline-offset:4px;border-radius:2px}

/* corner chrome */
.chrome{position:fixed;z-index:6;font-family:var(--mono);font-size:12.5px;letter-spacing:.02em;color:var(--ink)}
.chrome button,.chrome a{font:inherit;color:inherit;background:none;border:0;padding:10px 6px;margin:-10px -6px;cursor:pointer;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.chrome button:hover,.chrome a:hover{color:var(--ink-soft)}
.tl{top:calc(var(--pad) + env(safe-area-inset-top,0px));left:var(--pad)}
.tr{top:calc(var(--pad) + env(safe-area-inset-top,0px));right:var(--pad)}
.bl{bottom:calc(var(--pad) + env(safe-area-inset-bottom,0px));left:var(--pad)}
.br{bottom:calc(var(--pad) + env(safe-area-inset-bottom,0px));right:var(--pad);display:flex;gap:28px}
.mark{display:block;width:46px;height:46px}
.sep{opacity:.35}
.lang [aria-pressed="true"]{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.lang{display:flex;gap:10px}

/* statement */
.statement{
  position:fixed;z-index:2;left:50%;transform:translateX(-50%);
  bottom:calc(62vh + 3.2vh);width:min(92vw,980px);margin:0;text-align:center;
  font-family:"Newsreader Statement","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-style:italic;font-weight:400;
  font-size:clamp(22px,2.55vw,38px);line-height:1.28;letter-spacing:-.005em;
  text-shadow:0 0 28px var(--haze);
  opacity:0;filter:blur(6px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),filter .6s cubic-bezier(.2,.7,.2,1);
}
.ready .statement{opacity:1;filter:blur(0)}
.statement a,.panel a.inline{text-decoration:underline dotted;text-decoration-thickness:1px;text-underline-offset:.18em}
.statement a:hover{text-decoration-style:solid}

/* veil + panels */
.veil{position:fixed;inset:0;z-index:4;background:var(--veil);
  -webkit-backdrop-filter:blur(18px) saturate(1.15);backdrop-filter:blur(18px) saturate(1.15);

    `<h1 id="contactH">${esc(t.contactH)}</h1><div class="contact"><p>${esc(t.contactLead)}</p>
     <a class="big" href="mailto:matei3d@gmail.com">matei3d@gmail.com</a><p>${t.contactRest}</p></div>`;
  updateThemeLabel();

}

/* ---------------- routing / overlays ---------------- */
const body = document.body, menuBtn = document.getElementById("menuBtn");
let current = "home";
function show(id){
  const layers = ["menu","work","about","contact"];
  layers.forEach(l => { const el = document.getElementById(l); el.classList.remove("shown"); el.classList.remove("on"); });
  current = id; S.open = id !== "home";
  if (id === "home"){ body.classList.remove("open"); menuBtn.setAttribute("aria-expanded","false"); updateMenuLabel(); return; }
  body.classList.add("open");
  const el = document.getElementById(id);
  el.classList.add("on"); el.scrollTop = 0;
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("shown")));
  menuBtn.setAttribute("aria-expanded", String(id === "menu"));
  updateMenuLabel();
  const f = el.querySelector("a,button,h1"); if (f){ if (f.tagName === "H1") f.setAttribute("tabindex","-1"); f.focus({preventScroll:true}); }
}
function updateMenuLabel(){ menuBtn.textContent = current === "home" ? T[lang].menu : T[lang].close; }
function go(id, push=true){
  if (push){ const h = id === "home" ? " " : "#" + id; try{ history.pushState(null, "", id === "home" ? location.pathname + location.search : h); }catch(e){} }
  show(id);
}
document.addEventListener("click", e => {
  const a = e.target.closest("[data-go]"); if (!a) return;
  e.preventDefault(); go(a.dataset.go);
});
menuBtn.addEventListener("click", () => go(current === "home" ? "menu" : "home"));
document.getElementById("veil").addEventListener("click", () => go("home"));
document.addEventListener("keydown", e => { if (e.key === "Escape" && current !== "home") go("home"); });
window.addEventListener("popstate", () => { const h = location.hash.slice(1); show(["work","about","contact","menu"].includes(h) ? h : "home"); });
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => { lang = b.dataset.lang; store("a4d-lang", lang); render(); }));

/* ---------------- theme ---------------- */
const root = document.documentElement;
const viewerTheme = root.getAttribute("data-theme");
const modes = ["day","night","auto"];
let mode = modes.includes(load("a4d-mode")) ? load("a4d-mode") : "day";
const mq = matchMedia("(prefers-color-scheme: dark)");
function isNight(){
  if (mode === "night") return true;
  if (mode === "day") return false;
  const vt = viewerTheme;
  if (vt === "dark") return true; if (vt === "light") return false;
  return mq.matches;
}
function applyTheme(){
  if (mode === "auto"){ if (viewerTheme) root.setAttribute("data-theme", viewerTheme); else root.removeAttribute("data-theme"); }
  else root.setAttribute("data-theme", mode === "night" ? "dark" : "light");
  const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = isNight() ? "#071824" : "#E6F0F3";

}
function updateThemeLabel(){ const b = document.getElementById("themeBtn"); b.textContent = T[lang][mode]; b.setAttribute("aria-label", "Theme: " + mode); }
document.getElementById("themeBtn").addEventListener("click", () => { mode = modes[(modes.indexOf(mode) + 1) % 3]; store("a4d-mode", mode); applyTheme(); });
mq.addEventListener && mq.addEventListener("change", applyTheme);

/* ---------------- boot ---------------- */
lang = load("a4d-lang") === "fr" ? "fr" : (navigator.language || "").toLowerCase().startsWith("fr") && !load("a4d-lang") ? "fr" : "en";
applyTheme(); S.night = S.targetNight;
render();
const h0 = location.hash.slice(1); if (["work","about","contact","menu"].includes(h0)) show(h0);
// the first view comes up as soon as the statement's face is decoded (it is inside the page; 300 ms at most). The
// scene, and the menu's and panels' faces, start only after it is up, so nothing competes with it.
window.A4D_SHOWN = new Promise(done => {
  const up = () => requestAnimationFrame(() => { body.classList.add("ready"); done(); });
  Promise.race([document.fonts ? document.fonts.load('italic 400 1em "Newsreader Statement"') : null, new Promise(r => setTimeout(r, 300))]).then(up, up);
});
A4D_SHOWN.then(() => setTimeout(() => { if (document.fonts) for (const f of ["italic 300 1em Newsreader", "1em Newsreader"]) document.fonts.load(f).catch(() => {}); }, 1500));

<script>
/* ================= the lagoon: what both renderers share =================
   The tunables, the sea's spectra and their slope statistics, the noise tables and the framing, as plain data. The

let LAGOON_ = null;
const lagoon = () => LAGOON_ || (LAGOON_ = (() => {
/* ---------- the look, in one place ---------- */
const LOOK = {
  dbed: 1.1,                                   // depth of the sand bed in front of the viewer (m); it shelves away with distance
  sea: 0.42, chop: 0.85,                       // sea state and choppiness
  swell: { height: 0.08, length: 12, dir: 1.6, from: 10, to: 20 },   // the open sea's longer waves beyond the calm lagoon:
                                               // rms height (m), peak wavelength (m), heading (rad; 1.6 rolls in toward the
                                               // viewer, crests along the horizon), blended in between these distances (m)
  tiling: { from: 8, to: 11, cell: 4.2, turn: 20 },   // stochastic tiling of the chop's patch: blended in between these
                                               // distances (m), hexagonal cells this wide (m), turned within +-turn degrees
  sigA: [0.75, 0.11, 0.045],                   // absorption per metre: red goes first, then green
  sigS: [0.012, 0.02, 0.035],                  // scattering per metre: the particles that turn deep water blue
  god: 1.7,                                    // how far the light shafts stand out from their local average
  amb: 0.35,                                   // ambient light under water
  sandLo: [0.78, 0.80, 0.78], sandHi: [0.93, 0.94, 0.91],
  shelf: 0.45,                                 // how fast the bed falls away with distance (m per m)
  fog: 250,                                    // distance over which the far sea goes behind the horizon haze (m)
  sun: [55, 30],                               // elevation, azimuth (degrees, positive to the right)
  glint: 0.04,                                 // angular radius of the sun as the water reflects it (rad): more, softer sparkles
  capillary: 0.003,                            // slope variance per axis of ripples finer than the FFT (Cox and Munk give

  facets: 20000,                               // capillary facets per square metre: how finely far glitter breaks into sparkles
  sky: 1.4,                                    // sky brightness: the sky has to read as the light the water is lit by
  exposure: 1.5,                               // scene to GT7 frame-buffer units (1.0 = 100 nits)

  myopia: { sharp: 3, blur: 0.3, night: 1.4 }, // slightly short-sighted eye: sharp to 3 m, then a defocus that grows to
                                               // 0.3 degrees across at the horizon; the dilated night pupil adds 40%
  haze: { veil: [0.35, 0.15], blur: [1.5, 0.8], glow: [0.05, 0.03], up: 3, down: 1 },   // around the horizon, day and
                                               // night: airlight veil, softening (px) and forward-scatter glow at the
                                               // horizon; the band's half-heights above and below it (degrees)

/* ---------- the sea: a JONSWAP spectrum with a cross swell, choppy FFT over a 4.2 m patch ---------- */
const N = 256;
const L = 4.2;                   // patch size (m)

   It is seen only from LOOK.swell.from on, where a pixel spans decimetres along the view, so it can be coarse: a 32 x 32
   FFT over 61.4 m (14.6 times the chop's patch, so the two never share a period), waves from 8 m up (four texels each
   at the least), a swell peaked at LOOK.swell.length with a narrow spread, rolling in toward the viewer so that far out
   its crests lie along the horizon. Only its slopes are used, taken exactly in the spectrum (i k h), so one FFT gives
   both and no slope pass is needed. */

            * Math.pow(Math.abs(Math.cos((th - LOOK.swell.dir) * 0.5)), 24) * dk * dk;

const SLOPE2 = (() => {
  const { sxx, sxz, szz, hist } = H0S_DATA.userData, c = lossCurve(hist, L2 / N2, 0.41), k = LOOK.swell.height ** 2 * (1 - c.lost0);

})());

<script>
/* ================= the lagoon on three.js (WebGL2): the fallback where WebGPU is missing =================
   The water follows CAUSTIC//VOLUME by Scottie (MIT, see licenses/caustic-volume.txt): a choppy JONSWAP FFT sea,
   photon-grid caustics on a sand bed and through a stack of depth slices, light shafts measured against the
   slices' local average, a sky with drifting cumulus and a bloom pyramid. The FFT pass, the height-field intersection
   and the B-spline filter come from Clearwater by Aurélien at Lumaris (MIT, see licenses/clearwater.txt). Tone mapping
   is GT7's, ported from Polyphony Digital's sample implementation (MIT, see licenses/gt7-tone-mapping.txt). three.js is
   a thin layer over WebGL2 here: every pass is a RawShaderMaterial drawn into a render target. */
function startGL(){

const noGL = () => root.classList.add("no-gl");

const F32 = caps.isWebGL2 && ext.has("EXT_color_buffer_float");
if (!caps.isWebGL2 || !(F32 || ext.has("EXT_color_buffer_half_float"))) { renderer.dispose(); noGL(); return; }
renderer.autoClear = false;
renderer.setClearColor(0x000000, 0);

const S = window.A4D_STATE;            // shared with the UI: night (0..1), pointer, open
const HALF = THREE.HalfFloatType, FFT_TYPE = F32 ? THREE.FloatType : HALF;
const ANISO = caps.getMaxAnisotropy();

/* ---------- passes ---------- */
function rt(w, h, type, o = {}){
  const f = o.nearest ? THREE.NearestFilter : THREE.LinearFilter, wrap = o.repeat ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
  return new THREE.WebGLRenderTarget(w, h, { type, depthBuffer: false, magFilter: f, minFilter: o.mip ? THREE.LinearMipmapLinearFilter : f,
    wrapS: wrap, wrapT: o.clampT ? THREE.ClampToEdgeWrapping : wrap, generateMipmaps: !!o.mip, anisotropy: Math.min(o.aniso || 1, ANISO) });
}
const QUAD_VS = `precision highp float;
in vec2 position; out vec2 vUv;
void main(){ vUv = position * 0.5 + 0.5; gl_Position = vec4(position, 0.0, 1.0); }`;
const HEAD = `precision highp float; precision highp sampler2D; precision highp int;
in vec2 vUv; out vec4 o;
`;
const CMUL = `vec2 cmul(vec2 a, vec2 b){ return vec2(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x); }
`;
function shader(fs, uniforms){
  const u = {}; for (const k in uniforms) u[k] = uniforms[k] && uniforms[k].shared ? uniforms[k] : { value: uniforms[k] };
  return new THREE.RawShaderMaterial({ glslVersion: THREE.GLSL3, vertexShader: QUAD_VS, fragmentShader: HEAD + fs, uniforms: u, depthTest: false, depthWrite: false });
}
const shared = v => ({ value: v, shared: true });   // one uniform object used by several materials
const quad = new THREE.BufferGeometry();
quad.setAttribute("position", new THREE.BufferAttribute(new Float32Array([-1, -1, 3, -1, -1, 3]), 2));
const quadMesh = new THREE.Mesh(quad); quadMesh.frustumCulled = false;
const quadScene = new THREE.Scene(); quadScene.add(quadMesh);
const nullCam = new THREE.Camera();
function draw(mat, target, set){
  if (set) for (const k in set) mat.uniforms[k].value = set[k];
  quadMesh.material = mat;
  renderer.setRenderTarget(target);
  renderer.render(quadScene, nullCam);
}
function clear(target){ renderer.setRenderTarget(target); renderer.clear(true, false, false); }

// radix-2 FFT over a ping-pong pair, rows then columns; returns the index that holds the result
const mFFT = shader(CMUL + `
uniform sampler2D uSrc; uniform int uP, uHoriz, uHalf;
void main(){
  ivec2 id = ivec2(gl_FragCoord.xy);
  int j = uHoriz == 1 ? id.x : id.y;
  int k = j & (uP - 1);
  int i = ((j - (j & (2 * uP - 1))) >> 1) + k;
  ivec2 a = uHoriz == 1 ? ivec2(i, id.y) : ivec2(id.x, i);
  ivec2 b = uHoriz == 1 ? ivec2(i + uHalf, id.y) : ivec2(id.x, i + uHalf);
  vec4 x0 = texelFetch(uSrc, a, 0), x1 = texelFetch(uSrc, b, 0);
  float ang = 3.14159265359 * float(k) / float(uP);
  vec2 w = vec2(cos(ang), sin(ang));
  vec4 wx = vec4(cmul(w, x1.xy), cmul(w, x1.zw));
  o = (j & uP) != 0 ? x0 - wx : x0 + wx;
}`, { uSrc: null, uP: 1, uHoriz: 1, uHalf: 1 });
function fft(pair, n){
  let src = 0;
  for (const horiz of [1, 0])
    for (let p = 1; p < n; p <<= 1){ draw(mFFT, pair[1 - src], { uSrc: pair[src].texture, uP: p, uHoriz: horiz, uHalf: n >> 1 }); src = 1 - src; }
  return src;
}

const v3 = a => `vec3(${a.map(x => (+x).toFixed(4)).join(", ")})`;

const GL_CONST = `
const int N = ${N};
const float PATCH = ${L.toFixed(2)}, DBED = ${DBED.toFixed(2)}, DVOL = ${DVOL.toFixed(2)}, PI = 3.14159265359;
`;
const specTex = (sp, n) => { const t = new THREE.DataTexture(sp.data, n, n, THREE.RGBAFormat, THREE.FloatType); t.needsUpdate = true; return t; };
const H0 = specTex(H0_DATA, N), H0S = specTex(H0S_DATA, N2);
const ocean = [rt(N, N, FFT_TYPE, { nearest: true }), rt(N, N, FFT_TYPE, { nearest: true })];
const dispRT = rt(N, N, HALF, { repeat: true }), heightRT = rt(N, N, HALF, { nearest: true });
const surfRT = rt(N, N, HALF, { repeat: true, mip: true, aniso: 8 });
// h(k,t) = h0(k) e^{iwt} + conj(h0(-k)) e^{-iwt}, packed with the horizontal displacements: A = h + i Dx, B = Dz
const mSpec = shader(GL_CONST + `
uniform sampler2D uH0; uniform float uT;
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy);
  int mx = c.x < N / 2 ? c.x : c.x - N, mz = c.y < N / 2 ? c.y : c.y - N;
  if (mx == -N / 2 || mz == -N / 2 || (mx == 0 && mz == 0)){ o = vec4(0.0); return; }
  vec4 h0 = texelFetch(uH0, c, 0) * ${RMS.toFixed(5)};
  vec2 k = 2.0 * PI * vec2(float(mx), float(mz)) / PATCH;
  float kl = max(length(k), 1e-6);
  float w = sqrt(9.81 * kl * tanh(min(kl * DBED, 20.0)));
  float w0 = 2.0 * PI / ${LOOP.toFixed(1)}; w = max(floor(w / w0 + 0.5), 1.0) * w0;
  float cw = cos(w * uT), sw = sin(w * uT);
  vec2 a = h0.xy, b = h0.zw;
  vec2 h = vec2(a.x * cw - a.y * sw, a.x * sw + a.y * cw) + vec2(b.x * cw + b.y * sw, b.y * cw - b.x * sw);
  vec2 mih = vec2(h.y, -h.x);
  vec2 dx = mih * (k.x / kl), dz = mih * (k.y / kl);
  o = vec4(h + vec2(-dx.y, dx.x), dz);
}`, { uH0: H0, uT: 0 });
// (height, chop Dx, chop Dz, Jacobian)
const mDisp = shader(GL_CONST + `
uniform sampler2D uSrc;
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec4 C = texelFetch(uSrc, c, 0);
  vec4 R = texelFetch(uSrc, ivec2((c.x + 1) % N, c.y), 0), Lf = texelFetch(uSrc, ivec2((c.x + N - 1) % N, c.y), 0);
  vec4 U = texelFetch(uSrc, ivec2(c.x, (c.y + 1) % N), 0), D = texelFetch(uSrc, ivec2(c.x, (c.y + N - 1) % N), 0);
  float ih = float(N) / (2.0 * PATCH), ck = ${CHOPK.toFixed(4)};
  float dxx = (R.y - Lf.y) * ih, dzz = (U.z - D.z) * ih, dxz = (U.y - D.y) * ih, dzx = (R.z - Lf.z) * ih;
  o = vec4(C.x, C.y * ck, C.z * ck, (1.0 + ck * dxx) * (1.0 + ck * dzz) - ck * ck * dxz * dzx);
}`, { uSrc: null });
// invert the choppy displacement: the height that ends up over each texel
const mCompose = shader(GL_CONST + `
uniform sampler2D uDisp;
void main(){
  vec2 xz = vUv * PATCH, x0 = xz;
  for (int i = 0; i < 5; i++) x0 = xz - textureLod(uDisp, x0 / PATCH, 0.0).yz;
  vec4 d = textureLod(uDisp, x0 / PATCH, 0.0);
  o = vec4(d.x, d.w, 0.0, 1.0);
}`, { uDisp: dispRT.texture });
// slopes by central differences -> (height, dh/dx, dh/dz, Jacobian)
const mSlopes = shader(GL_CONST + `
uniform sampler2D uH;
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec4 C = texelFetch(uH, c, 0);
  float l = texelFetch(uH, ivec2((c.x + N - 1) % N, c.y), 0).x, r = texelFetch(uH, ivec2((c.x + 1) % N, c.y), 0).x;
  float d = texelFetch(uH, ivec2(c.x, (c.y + N - 1) % N), 0).x, u = texelFetch(uH, ivec2(c.x, (c.y + 1) % N), 0).x;
  vec2 sl = vec2(r - l, u - d) * (float(N) / (2.0 * PATCH));
  float m = length(sl); if (m > 2.5) sl *= 2.5 / m;
  o = vec4(C.x, sl, C.y);
}`, { uH: heightRT.texture });
const ocean2 = [rt(N2, N2, FFT_TYPE, { nearest: true }), rt(N2, N2, FFT_TYPE, { nearest: true })];
const surf2RT = rt(N2, N2, HALF, { repeat: true, mip: true });
const mSpec2 = shader(`
const int N = ${N2}; const float PATCH = ${L2.toFixed(2)}, PI = 3.14159265359;
uniform sampler2D uH0; uniform float uT;
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy);
  int mx = c.x < N / 2 ? c.x : c.x - N, mz = c.y < N / 2 ? c.y : c.y - N;
  if (mx == -N / 2 || mz == -N / 2 || (mx == 0 && mz == 0)){ o = vec4(0.0); return; }
  vec4 h0 = texelFetch(uH0, c, 0) * ${LOOK.swell.height.toFixed(4)};
  vec2 k = 2.0 * PI * vec2(float(mx), float(mz)) / PATCH;
  float kl = length(k), w = sqrt(9.81 * kl * tanh(min(kl * 8.0, 20.0)));   // about 8 m of water under the swell
  float w0 = 2.0 * PI / ${LOOP.toFixed(1)}; w = max(floor(w / w0 + 0.5), 1.0) * w0;
  float cw = cos(w * uT), sw = sin(w * uT);
  vec2 a = h0.xy, b = h0.zw;
  vec2 h = vec2(a.x * cw - a.y * sw, a.x * sw + a.y * cw) + vec2(b.x * cw + b.y * sw, b.y * cw - b.x * sw);
  o = vec4(-k.x * h.y - k.y * h.x, k.x * h.x - k.y * h.y, 0.0, 0.0);    // i kx h + i (i kz h): the slopes as one complex
}`, { uH0: H0S, uT: 0 });
// the slopes into a filtered, mipmapped texture
const mCopy2 = shader(`
uniform sampler2D uSrc;
void main(){ o = vec4(texelFetch(uSrc, ivec2(gl_FragCoord.xy), 0).xy, 0.0, 0.0); }`, { uSrc: null });
function runSea(t){
  draw(mSpec, ocean[0], { uT: t % LOOP });
  draw(mDisp, dispRT, { uSrc: ocean[fft(ocean, N)].texture });
  draw(mCompose, heightRT);
  draw(mSlopes, surfRT);
  draw(mSpec2, ocean2[0], { uT: t % LOOP });
  draw(mCopy2, surf2RT, { uSrc: ocean2[fft(ocean2, N2)].texture });
}

/* ---------- caustics: one photon per grid vertex, refracted to a horizontal plane; intensity = area before / after ---------- */
const light = { sun: shared(new THREE.Vector3()), glint: shared(new THREE.Vector3()), col: shared(new THREE.Vector3()), lw: shared(new THREE.Vector3()), flatT: shared(1), causK: shared(1), amb: shared(new THREE.Vector3()) };
// G photons per patch side, on a window E cells wider than the patch on every side. Each pass slides the window by
// whole cells to where flat water would send its light from (uOrigin), so every photon that lands in the map is drawn
// once, at the same lattice point as in a 3 x 3 tiling of the patch, for a fifth of the vertices.
function photonGrid(G, E){
  const g = new THREE.BufferGeometry(), W = G + 2 * E;
  const v = new Float32Array((W + 1) * (W + 1) * 2); let o = 0;
  for (let j = 0; j <= W; j++) for (let i = 0; i <= W; i++){ v[o++] = i - E; v[o++] = j - E; }
  const idx = new Uint32Array(W * W * 6); o = 0;
  for (let j = 0; j < W; j++) for (let i = 0; i < W; i++){ const a = j * (W + 1) + i, b = a + 1, c = a + W + 1, d = c + 1; idx[o++] = a; idx[o++] = b; idx[o++] = c; idx[o++] = b; idx[o++] = d; idx[o++] = c; }
  g.setAttribute("position", new THREE.BufferAttribute(v, 2));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  g.userData.G = G;
  return g;
}
const FRESNEL = `float fresnelDielectric(float cosi, float etai, float etat){
  cosi = clamp(cosi, 0.0, 1.0);
  float sint = etai / etat * sqrt(max(0.0, 1.0 - cosi * cosi));
  if (sint >= 1.0) return 1.0;
  float cost = sqrt(max(0.0, 1.0 - sint * sint));
  float rs = (etat * cosi - etai * cost) / (etat * cosi + etai * cost);
  float rp = (etai * cosi - etat * cost) / (etai * cosi + etat * cost);
  return 0.5 * (rs * rs + rp * rp);
}
`;
function causMaterial(ior, mask, sliceY, lod, G){
  return new THREE.RawShaderMaterial({
    glslVersion: THREE.GLSL3,
    uniforms: { uSurf: { value: surfRT.texture }, uSun: light.sun, uLw: light.lw, uFlatT: light.flatT,
      uIor: { value: ior }, uMask: { value: new THREE.Vector4(...mask) }, uSliceY: { value: sliceY }, uLod: { value: lod },
      uOrigin: { value: new THREE.Vector2() }, uG: { value: G } },
    vertexShader: `precision highp float; precision highp sampler2D;
      ${GL_CONST}
      in vec2 position;
      uniform sampler2D uSurf; uniform vec3 uSun, uLw; uniform vec2 uOrigin; uniform float uFlatT, uIor, uSliceY, uLod, uG;
      out vec2 vOld, vNew; out float vW;
      ${FRESNEL}
      void main(){
        vec2 c = (position + uOrigin) / uG;                       // the photon's lattice point, in patches
        vec4 s = textureLod(uSurf, c, uLod);                      // slopes band-limited to the photon spacing
        vec3 p = vec3(c.x * PATCH, s.x, c.y * PATCH);
        vec3 n = normalize(vec3(-s.y, 1.0, -s.z));
        float ci = dot(n, uSun);
        float T = ci > 0.0 ? (1.0 - fresnelDielectric(ci, 1.0, 1.333)) / uFlatT : 0.0;
        vec3 d = refract(-uSun, n, 1.0 / uIor);
        if (dot(d, d) < 0.5) d = vec3(0.0, -1.0, 0.0);
        vec3 q = p + d * max((uSliceY - p.y) / min(d.y, -1e-3), 0.0);
        vOld = p.xz + uLw.xz * (uSliceY / uLw.y);                // where flat water would have sent it
        vNew = q.xz;
        vW = clamp(T, 0.0, 25.0);
        gl_Position = vec4((q.xz / PATCH) * 2.0 - 1.0, 0.0, 1.0);
      }`,
    fragmentShader: `precision highp float;
      in vec2 vOld, vNew; in float vW; out vec4 o; uniform vec4 uMask;
      void main(){
        vec2 ox = dFdx(vOld), oy = dFdy(vOld), nx = dFdx(vNew), ny = dFdy(vNew);
        float I = abs(ox.x * oy.y - ox.y * oy.x) / max(abs(nx.x * ny.y - nx.y * ny.x), 1e-14);
        if ((floatBitsToUint(I) & 0x7F800000u) == 0x7F800000u) I = 0.0;
        o = uMask * (min(I, 24.0) * vW);
      }`,
    blending: THREE.CustomBlending, blendEquation: THREE.AddEquation, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
    depthTest: false, depthWrite: false, transparent: true
  });
}
function causScene(geo, mats){
  const sc = new THREE.Scene();
  for (const m of mats){ const mesh = new THREE.Mesh(geo, m); mesh.frustumCulled = false; sc.add(mesh); }
  return sc;
}
// the bed: one map per colour channel, each refracted with its own index (dispersion)
const floorRT = rt(FLOOR_RES, FLOOR_RES, HALF, { repeat: true, mip: true, aniso: 8 });
const floorScene = causScene(photonGrid(192, CAUS_EDGE.floor), [[1.3310, [1, 0, 0, 0]], [1.3340, [0, 1, 0, 0]], [1.3380, [0, 0, 1, 0]]]
  .map(([ior, m]) => causMaterial(ior, m, -DBED, 0.0, 192)));
// the volume: eight horizontal slices from the surface to the bed, four to a texture (one per channel)
const sliceRT = [0, 1].map(() => rt(SLICE_RES, SLICE_RES, HALF, { repeat: true, mip: true }));
const sliceGeo = photonGrid(96, CAUS_EDGE.slice);
const sliceScenes = [0, 1].map(r => causScene(sliceGeo, [0, 1, 2, 3].map(c => {
  const k = r * 4 + c; return causMaterial(1.333, [0, 1, 2, 3].map(i => +(i === c)), -DVOL * k / (SLICES - 1), 1.4, 96);
})));
// each pass's window starts where flat water sends the light that lands at the map's corner
function causOrigins(scene){
  for (const m of scene.children){
    const u = m.material.uniforms, lw = light.lw.value, k = u.uSliceY.value / Math.min(lw.y, -1e-3) / L, G = u.uG.value;
    u.uOrigin.value.set(Math.round(-lw.x * k * G), Math.round(-lw.z * k * G));
  }
}
function renderCaustics(){
  causOrigins(floorScene); clear(floorRT); renderer.render(floorScene, nullCam);   // one render per map: the mip chain is built once
  for (let r = 0; r < 2; r++){ causOrigins(sliceScenes[r]); clear(sliceRT[r]); renderer.render(sliceScenes[r], nullCam); }
}

/* ---------- sky: gradient, haze band, drifting cumulus; baked into an environment map for reflections ---------- */
const SKY_GLSL = `
uniform vec3 uSun, uSunCol, uGlint; uniform float uNight, uTime;
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec3 hash32(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yxz + 33.33); return fract((p3.xxy + p3.yzz) * p3.zyx); }
float hash13(vec3 p3){ p3 = fract(p3 * 0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y);
}
float vnoise3(vec3 p){
  vec3 i = floor(p), f = fract(p); vec3 u = f * f * (3.0 - 2.0 * f);
  float a = mix(mix(hash13(i), hash13(i + vec3(1, 0, 0)), u.x), mix(hash13(i + vec3(0, 1, 0)), hash13(i + vec3(1, 1, 0)), u.x), u.y);
  float b = mix(mix(hash13(i + vec3(0, 0, 1)), hash13(i + vec3(1, 0, 1)), u.x), mix(hash13(i + vec3(0, 1, 1)), hash13(i + vec3(1, 1, 1)), u.x), u.y);
  return mix(a, b, u.z);
}
float fbm2(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 6; i++){ s += a * vnoise(p); p = mat2(1.6, 1.2, -1.2, 1.6) * p; a *= 0.5; } return s; }
// a cumulus bank on the horizon: towers by azimuth, billowed edges, sunlit tops and blue-grey bases
vec4 cumulusBank(vec3 d){
  float e = d.y;
  if (e > 0.13 || e < -0.01) return vec4(0.0);
  float az = atan(d.x, -d.z) + uTime * 0.0012;
  float big = vnoise(vec2(az * 2.2, 3.7)) * 0.55 + vnoise(vec2(az * 5.3, 9.1)) * 0.3 + vnoise(vec2(az * 13.0, 1.3)) * 0.15;
  float H = 0.012 + 0.095 * pow(smoothstep(0.28, 0.78, big), 1.2);
  vec2 q = vec2(az, e) * 62.0;
  float bill = fbm2(q);
  float m = smoothstep(0.0, 0.0035, H + 0.02 * (bill - 0.5) - e);
  float t = clamp(e / max(H, 1e-3), 0.0, 1.0);
  float lit = clamp(0.2 + 1.0 * t + 0.9 * (fbm2(q * 1.7 + 4.0) - 0.45), 0.0, 1.0);
  return vec4(vec3(lit), m);
}
// the horizon's colour, and the haze between the eye and the horizon: the cloud bank's base and the sea's far edge sit
// behind the same amount of it, so they meet at the horizon
const float HAZE = 0.45;
vec3 horizonCol(){
  return mix(mix(vec3(0.520, 0.300, 0.160), vec3(0.540, 0.790, 0.980), smoothstep(-0.02, 0.35, uSun.y)), vec3(0.010, 0.029, 0.050), uNight);
}
vec3 hazeCol(){ return horizonCol() * 1.12 * mix(${LOOK.sky.toFixed(3)}, 0.85, uNight); }
vec3 skyRadiance(vec3 d){
  vec3 s = uGlint;
  float sunH = uSun.y, y = max(d.y, 0.0), mu = dot(d, s), m = max(mu, 0.0);
  // a clear summer sky: deep cyan-blue overhead, paling toward a bright horizon
  vec3 zen = mix(vec3(0.010, 0.040, 0.160), vec3(0.006, 0.240, 0.700), smoothstep(-0.05, 0.45, sunH));
  vec3 mid = vec3(0.050, 0.460, 0.900);
  vec3 hor = horizonCol();
  vec3 tint = mix(vec3(1.0, 0.55, 0.25), vec3(1.0, 0.96, 0.90), smoothstep(0.0, 0.4, sunH));
  // night keeps the same structure, dimmed and cooled, with the glow of the moon instead of the sun
  zen = mix(zen, vec3(0.0016, 0.0050, 0.0140), uNight);
  mid = mix(mid, vec3(0.0040, 0.0120, 0.0300), uNight);
  vec3 glow = mix(tint, vec3(0.62, 0.78, 0.95) * 0.06, uNight);
  vec3 col = mix(mix(hor, mid, smoothstep(0.0, 0.35, pow(y, 0.6))), zen, smoothstep(0.25, 1.0, y));
  col += glow * (0.10 * pow(m, 6.0) + 0.35 * pow(m, 48.0) + 1.6 * pow(m, 700.0)) * (1.0 - 0.6 * y);
  col = mix(col, hor * 1.12, exp(-y * 22.0) * 0.5);              // horizon haze band
  vec3 cloudLit = mix(vec3(1.32, 1.33, 1.36), vec3(0.030, 0.040, 0.055), uNight);
  vec3 cloudDark = mix(vec3(0.42, 0.58, 0.84), vec3(0.004, 0.007, 0.012), uNight);
  // high, sparse fair-weather clouds and wisps
  if (d.y > 0.02){
    vec2 cp = d.xz / (d.y + 0.08) * 1.1 + vec2(uTime * 0.010, uTime * 0.003);
    float n = fbm2(cp * vec2(1.0, 1.6));
    float cl = smoothstep(0.58, 0.78, n) * smoothstep(0.02, 0.2, d.y);

const FRAME_MS = 1000 / 30, gl = renderer.getContext();
let clock = 0, lastDraw = -1, nextDraw = 0, running = true, shown = false, frameNo = 0, raf = 0;
let fence = null, fenceT = 0, gpuMs = 0, overN = 0, underN = 0;
let envAt = -1, envNight = -1;
document.addEventListener("visibilitychange", () => {
  running = !document.hidden && !root.classList.contains("no-gl");
  if (running){ lastDraw = -1; nextDraw = 0; cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); }
});
const yaw = { v: 0 }, pitch = { v: 0 };
function tick(now){
  if (!running) return;
  raf = requestAnimationFrame(tick);
  if (fence && gl.getSyncParameter(fence, gl.SYNC_STATUS) === gl.SIGNALED){ gpuMs = now - fenceT; gl.deleteSync(fence); fence = null; }
  // pace against a running target, so any refresh rate averages 30 frames a second
  const interval = (S.open ? 2 : 1) * FRAME_MS;
  if (now < nextDraw - 2) return;
  nextDraw = now - nextDraw > interval ? now + interval : nextDraw + interval;
  if (fence && now - fenceT > 1000){ gl.deleteSync(fence); fence = null; }          // a fence that never signals tells nothing
  if (!S.open){
    if (fence){ overN++; underN = 0; }
    else if (gpuMs < FRAME_MS * 0.55){ underN++; overN = Math.max(0, overN - 1); }
    else { underN = 0; overN = Math.max(0, overN - 1); }
    if (overN > 8 && quality > 0.5){ quality = Math.max(0.5, quality * 0.85); overN = 0; frame(); }
    else if (underN > 90 && quality < 1.0){ quality = Math.min(1.0, quality * 1.08); underN = 0; frame(); }
  }
  // the clock follows real elapsed time, so the water moves at the same pace at any frame rate
  if (lastDraw < 0) lastDraw = now - FRAME_MS;
  const real = Math.min(0.5, (now - lastDraw) / 1000), dt = Math.min(0.1, real);
  lastDraw = now;

  clock += real * LOOK.speed;
  S.stats.frames++; S.stats.real = real; S.stats.clock = clock; S.stats.gpuMs = gpuMs;
  S.night += (S.targetNight - S.night) * Math.min(1, dt * 1.4);
  const n = S.night, t = clock + 30.0;
  lighting(n);

  // the pointer turns the head a little; a slow handheld drift keeps the frame alive
  yaw.v += ((-S.pointer[0]) * 0.035 - yaw.v) * Math.min(1, dt * 1.1);
  pitch.v += ((-S.pointer[1]) * 0.012 - pitch.v) * Math.min(1, dt * 1.1);
  camera.position.set(0.03 * Math.sin(t * 0.21), EYE + 0.015 * Math.sin(t * 0.57), 0.03 * Math.cos(t * 0.17));
  camera.rotation.set(basePitch + pitch.v + 0.004 * Math.sin(t * 0.47 + 2.0) + 0.002 * Math.sin(t * 1.13),
                      yaw.v + 0.010 * Math.sin(t * 0.31) + 0.005 * Math.sin(t * 0.83 + 1.3), 0.004 * Math.sin(t * 0.39 + 0.4), "YXZ");
  camera.updateMatrixWorld();
  camRot.setFromMatrix4(camera.matrixWorld);

  runSea(t);
  if (t - envAt > 0.5 || Math.abs(n - envNight) > 0.01){ draw(mEnv, envRT, { uNight: n, uTime: t }); envAt = t; envNight = n; }
  renderCaustics();
  draw(mWater, hdrRT, { uTime: t, uNight: n });
  post(n, frameNo);
  frameNo++;

  if (!fence){ fence = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0); gl.flush(); fenceT = now; }

  if (!shown){
    // a shader that failed to build leaves the plain gradient in place rather than a broken frame
    if (renderer.info.programs.some(p => p.diagnostics && !p.diagnostics.runnable)){ running = false; noGL(); return; }
    shown = true; root.classList.add("gl");
  }
}
raf = requestAnimationFrame(tick);
}

<script>
/* ================= the lagoon on WebGPU =================
   The same picture as the three.js renderer, drawn with compute where it pays. Each frame: one compute pass for the
   sea (each FFT line in workgroup memory with the spectrum evolved as it loads, the choppy surface inverted and its
   slopes taken in one tiled kernel, the swell, the mip chains), render passes for the caustics, the sky map (twice a
   second) and the water, a compute pass for the HDR frame's mips and the bloom, and the final pass to the canvas.
   Every offscreen map keeps WebGL's row order (row 0 at the bottom of the view), so the shaders read exactly as their
   GLSL twins; only the final pass turns the picture for the canvas. */
async function startGPU(canvas){
const { LOOK, N, L, DBED, SEA, RMS, CHOPK, LOOP, DVOL, H0_DATA, SLOPE, N2, L2, H0S_DATA, SLOPE2, FLOOR_RES, CAUS_EDGE,

const ADAPTER = [ainfo.vendor, ainfo.architecture, ainfo.description].filter(Boolean).join(" ");

/* ---------- WGSL text: numbers as the GLSL twin writes them ---------- */
const v3 = a => `vec3f(${a.map(x => (+x).toFixed(4)).join(", ")})`;
const FRAME = `
struct Frame {
  invProj: mat4x4f, camRot: mat3x3f,
  cam: vec3f, time: f32, sun: vec3f, night: f32, sunCol: vec3f, pixAng: f32, glint: vec3f, flatT: f32,
  lw: vec3f, causK: f32, amb: vec3f, frame: f32, res: vec2f, blurPx: f32, exposure: f32, air: vec3f, hazeV: f32,

const PI = 3.14159265359;
`;
// offscreen full-screen triangle: row r of the target is row r of WebGL's, and uv runs as WebGL's vUv
const VS_OFF = `
struct VO { @builtin(position) pos: vec4f, @location(0) uv: vec2f };
@vertex fn vs(@builtin(vertex_index) i: u32) -> VO {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u)) * 2.0 - 1.0;
  var o: VO; o.pos = vec4f(p.x, -p.y, 0.0, 1.0); o.uv = p * 0.5 + 0.5; return o;
}`;
const SKY = `
fn hash12(p: vec2f) -> f32 { var p3 = fract(vec3f(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
fn hash32(p: vec2f) -> vec3f { var p3 = fract(vec3f(p.xyx) * vec3f(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yxz + 33.33); return fract((p3.xxy + p3.yzz) * p3.zyx); }
fn hash13(q: vec3f) -> f32 { var p3 = fract(q * 0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
fn vnoise(p: vec2f) -> f32 {
  let i = floor(p); let f = fract(p); let u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2f(1.0, 0.0)), u.x), mix(hash12(i + vec2f(0.0, 1.0)), hash12(i + vec2f(1.0, 1.0)), u.x), u.y);
}
fn fbm2(p0: vec2f) -> f32 { var s = 0.0; var a = 0.5; var p = p0; for (var i = 0; i < 6; i++) { s += a * vnoise(p); p = mat2x2f(1.6, 1.2, -1.2, 1.6) * p; a *= 0.5; } return s; }
fn cumulusBank(d: vec3f) -> vec4f {
  let e = d.y;
  if (e > 0.13 || e < -0.01) { return vec4f(0.0); }
  let az = atan2(d.x, -d.z) + F.time * 0.0012;
  let big = vnoise(vec2f(az * 2.2, 3.7)) * 0.55 + vnoise(vec2f(az * 5.3, 9.1)) * 0.3 + vnoise(vec2f(az * 13.0, 1.3)) * 0.15;
  let H = 0.012 + 0.095 * pow(smoothstep(0.28, 0.78, big), 1.2);
  let q = vec2f(az, e) * 62.0;
  let bill = fbm2(q);
  let m = smoothstep(0.0, 0.0035, H + 0.02 * (bill - 0.5) - e);
  let t = clamp(e / max(H, 1e-3), 0.0, 1.0);
  let lit = clamp(0.2 + 1.0 * t + 0.9 * (fbm2(q * 1.7 + 4.0) - 0.45), 0.0, 1.0);

}
const HAZE = 0.45;
fn horizonCol() -> vec3f {
  return mix(mix(vec3f(0.520, 0.300, 0.160), vec3f(0.540, 0.790, 0.980), smoothstep(-0.02, 0.35, F.sun.y)), vec3f(0.010, 0.029, 0.050), F.night);

fn hazeCol() -> vec3f { return horizonCol() * 1.12 * mix(${LOOK.sky.toFixed(3)}, 0.85, F.night); }
fn skyRadiance(d: vec3f) -> vec3f { return skyAndBank(d).rgb; }
// the sky, and in alpha the cumulus bank's mask: its edge is the sky's one sharp feature
fn skyAndBank(d: vec3f) -> vec4f {
  let s = F.glint;
  let sunH = F.sun.y; let y = max(d.y, 0.0); let mu = dot(d, s); let m = max(mu, 0.0);
  var zen = mix(vec3f(0.010, 0.040, 0.160), vec3f(0.006, 0.240, 0.700), smoothstep(-0.05, 0.45, sunH));
  var mid = vec3f(0.050, 0.460, 0.900);
  let hor = horizonCol();
  let tint = mix(vec3f(1.0, 0.55, 0.25), vec3f(1.0, 0.96, 0.90), smoothstep(0.0, 0.4, sunH));
  zen = mix(zen, vec3f(0.0016, 0.0050, 0.0140), F.night);
  mid = mix(mid, vec3f(0.0040, 0.0120, 0.0300), F.night);
  let glow = mix(tint, vec3f(0.62, 0.78, 0.95) * 0.06, F.night);
  var col = mix(mix(hor, mid, smoothstep(0.0, 0.35, pow(y, 0.6))), zen, smoothstep(0.25, 1.0, y));
  col += glow * (0.10 * pow(m, 6.0) + 0.35 * pow(m, 48.0) + 1.6 * pow(m, 700.0)) * (1.0 - 0.6 * y);
  col = mix(col, hor * 1.12, exp(-y * 22.0) * 0.5);
  let cloudLit = mix(vec3f(1.32, 1.33, 1.36), vec3f(0.030, 0.040, 0.055), F.night);
  let cloudDark = mix(vec3f(0.42, 0.58, 0.84), vec3f(0.004, 0.007, 0.012), F.night);
  if (d.y > 0.02) {
    let cp = d.xz / (d.y + 0.08) * 1.1 + vec2f(F.time * 0.010, F.time * 0.003);
    let n = fbm2(cp * vec2f(1.0, 1.6));
    let cl = smoothstep(0.58, 0.78, n) * smoothstep(0.02, 0.2, d.y);
    let wisp = smoothstep(0.55, 0.85, fbm2(cp * vec2f(0.6, 3.2) + 9.0)) * 0.45 * smoothstep(0.05, 0.3, d.y);
    let lit = clamp(0.75 + (n - fbm2(cp * vec2f(1.0, 1.6) + s.xz * 0.15)) * 5.0, 0.45, 1.0);
    col = mix(col, mix(cloudDark, cloudLit, lit), max(cl, wisp) * 0.92);
  }
  let cb = cumulusBank(d);
  if (cb.a > 0.0) {
    var cc = mix(cloudDark, cloudLit, cb.r) + tint * pow(m, 8.0) * 0.4 * (1.0 - F.night);
    cc = mix(cc, hor * 1.12, exp(-max(d.y, 0.0) * 45.0) * HAZE);
    col = mix(col, cc, cb.a);
  }
  return vec4f(col * mix(${LOOK.sky.toFixed(3)}, 0.85, F.night), cb.a);
}`;
// the camera ray through a pixel (WebGL's gl_FragCoord), and the disc of the glint sun or the moon
const VIEW = `
fn ray(fc: vec2f) -> vec3f {
  let ndc = fc / F.res * 2.0 - 1.0;
  let vp = F.invProj * vec4f(ndc, -1.0, 1.0);
  return normalize(F.camRot * (vp.xyz / vp.w));
}
fn disc(d: vec3f, cone: f32) -> vec3f {
  let r = max(mix(0.0105, 0.012, F.night), cone);

  return F.sunCol * (1.0 - smoothstep(r * 0.8, r * 1.2, ang)) / (PI * r * r);
}`;
const FRESNEL = `
fn fresnelDielectric(c0: f32, etai: f32, etat: f32) -> f32 {
  let cosi = clamp(c0, 0.0, 1.0);
  let sint = etai / etat * sqrt(max(0.0, 1.0 - cosi * cosi));
  if (sint >= 1.0) { return 1.0; }
  let cost = sqrt(max(0.0, 1.0 - sint * sint));
  let rs = (etat * cosi - etai * cost) / (etat * cosi + etai * cost);
  let rp = (etai * cosi - etat * cost) / (etai * cosi + etat * cost);
  return 0.5 * (rs * rs + rp * rp);
}`;

/* ---------- the sea ---------- */
const FFT = n => `
const NN = ${n}u; const HALFN = ${n / 2}u;
var<workgroup> buf: array<array<vec4f, ${n}>, 2>;
fn cmul(a: vec2f, b: vec2f) -> vec2f { return vec2f(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x); }
fn fftLine(j: u32) -> u32 {
  var src = 0u;
  for (var p = 1u; p < NN; p = p << 1u) {
    let k = j & (p - 1u);
    let i = ((j - (j & (2u * p - 1u))) >> 1u) + k;
    let a = buf[src][i]; let b = buf[src][i + HALFN];
    let ang = PI * f32(k) / f32(p);
    let w = vec2f(cos(ang), sin(ang));
    let wx = vec4f(cmul(w, b.xy), cmul(w, b.zw));
    buf[1u - src][j] = select(a + wx, a - wx, (j & p) != 0u);
    workgroupBarrier();
    src = 1u - src;
  }
  return src;
}
struct O { t: f32, _a: f32, _b: f32, _c: f32 };
@group(0) @binding(0) var<uniform> U: O;
@group(0) @binding(1) var<storage, read_write> lines: array<vec4f>;
@group(0) @binding(2) var h0: texture_2d<f32>;
@compute @workgroup_size(${n})
fn rows(@builtin(local_invocation_id) lid: vec3u, @builtin(workgroup_id) wid: vec3u) {
  let j = lid.x; let y = wid.x;
  buf[0][j] = spec(vec2i(i32(j), i32(y)));
  workgroupBarrier();
  let r = fftLine(j);
  lines[y * NN + j] = buf[r][j];
}
@compute @workgroup_size(${n})
fn cols(@builtin(local_invocation_id) lid: vec3u, @builtin(workgroup_id) wid: vec3u) {
  let j = lid.x; let x = wid.x;
  buf[0][j] = lines[j * NN + x];
  workgroupBarrier();
  let r = fftLine(j);

const chopWGSL = `const PI = 3.14159265359;` + FFT(N) + `
@group(0) @binding(3) var disp: texture_storage_2d<rgba16float, write>;
const PATCH = ${L.toFixed(2)}; const DBED = ${DBED.toFixed(2)};
// h(k,t) = h0(k) e^{iwt} + conj(h0(-k)) e^{-iwt}, packed with the horizontal displacements as h + i Dx, Dz
fn spec(c: vec2i) -> vec4f {
  let n = i32(NN);
  let mx = select(c.x - n, c.x, c.x < n / 2); let mz = select(c.y - n, c.y, c.y < n / 2);
  if (mx == -n / 2 || mz == -n / 2 || (mx == 0 && mz == 0)) { return vec4f(0.0); }
  let h0v = textureLoad(h0, c, 0) * ${RMS.toFixed(5)};
  let k = 2.0 * PI * vec2f(f32(mx), f32(mz)) / PATCH;
  let kl = max(length(k), 1e-6);
  var w = sqrt(9.81 * kl * tanh(min(kl * DBED, 20.0)));
  let w0 = 2.0 * PI / ${LOOP.toFixed(1)}; w = max(floor(w / w0 + 0.5), 1.0) * w0;
  let cw = cos(w * U.t); let sw = sin(w * U.t);
  let a = h0v.xy; let b = h0v.zw;
  let h = vec2f(a.x * cw - a.y * sw, a.x * sw + a.y * cw) + vec2f(b.x * cw + b.y * sw, b.y * cw - b.x * sw);
  let mih = vec2f(h.y, -h.x);
  let dx = mih * (k.x / kl); let dz = mih * (k.y / kl);
  return vec4f(h + vec2f(-dx.y, dx.x), dz);
}
// the displacement as the surface uses it: height, chop Dx, chop Dz
fn emit(c: vec2i, C: vec4f) { textureStore(disp, c, vec4f(C.x, C.y * ${CHOPK.toFixed(4)}, C.z * ${CHOPK.toFixed(4)}, 0.0)); }`;
const swellWGSL = `const PI = 3.14159265359;` + FFT(N2) + `
@group(0) @binding(3) var surf2: texture_storage_2d<rgba16float, write>;
const PATCH = ${L2.toFixed(2)};
// only the swell's slopes, taken in the spectrum: i kx h + i (i kz h) as one complex signal
fn spec(c: vec2i) -> vec4f {
  let n = i32(NN);
  let mx = select(c.x - n, c.x, c.x < n / 2); let mz = select(c.y - n, c.y, c.y < n / 2);
  if (mx == -n / 2 || mz == -n / 2 || (mx == 0 && mz == 0)) { return vec4f(0.0); }
  let h0v = textureLoad(h0, c, 0) * ${LOOK.swell.height.toFixed(4)};
  let k = 2.0 * PI * vec2f(f32(mx), f32(mz)) / PATCH;
  let kl = length(k);
  var w = sqrt(9.81 * kl * tanh(min(kl * 8.0, 20.0)));
  let w0 = 2.0 * PI / ${LOOP.toFixed(1)}; w = max(floor(w / w0 + 0.5), 1.0) * w0;
  let cw = cos(w * U.t); let sw = sin(w * U.t);
  let a = h0v.xy; let b = h0v.zw;
  let h = vec2f(a.x * cw - a.y * sw, a.x * sw + a.y * cw) + vec2f(b.x * cw + b.y * sw, b.y * cw - b.x * sw);
  return vec4f(-k.x * h.y - k.y * h.x, k.x * h.x - k.y * h.y, 0.0, 0.0);
}
fn emit(c: vec2i, C: vec4f) { textureStore(surf2, c, vec4f(C.x, C.y, 0.0, 0.0)); }`;
// invert the choppy displacement (the height that ends up over each texel), then slopes by central differences: a
// 16 x 16 tile composes its heights and a one-texel rim in workgroup memory. Heights are rounded to half precision, as
// the three.js renderer stores them, so the two agree bit for bit.
const surfWGSL = `
const NN = ${N}; const PATCH = ${L.toFixed(2)};
@group(0) @binding(0) var dispT: texture_2d<f32>;
@group(0) @binding(1) var sRep: sampler;
@group(0) @binding(2) var surf: texture_storage_2d<rgba16float, write>;
var<workgroup> hs: array<f32, 324>;
fn half(x: f32) -> f32 { return unpack2x16float(pack2x16float(vec2f(x, 0.0))).x; }
fn composeH(c: vec2i) -> f32 {
  let xz = (vec2f(c) + 0.5) / f32(NN) * PATCH;
  var x0 = xz;
  for (var i = 0; i < 5; i++) { x0 = xz - textureSampleLevel(dispT, sRep, x0 / PATCH, 0.0).yz; }
  return half(textureSampleLevel(dispT, sRep, x0 / PATCH, 0.0).x);
}
@compute @workgroup_size(16, 16)
fn main(@builtin(local_invocation_index) li: u32, @builtin(local_invocation_id) lid: vec3u, @builtin(workgroup_id) wid: vec3u) {
  let base = vec2i(wid.xy) * 16 - 1;
  for (var q = li; q < 324u; q += 256u) {
    let c = base + vec2i(i32(q % 18u), i32(q / 18u));
    hs[q] = composeH((c + NN) % NN);
  }
  workgroupBarrier();
  let x = i32(lid.x) + 1; let y = i32(lid.y) + 1;
  let l = hs[y * 18 + x - 1]; let r = hs[y * 18 + x + 1]; let d = hs[(y - 1) * 18 + x]; let u = hs[(y + 1) * 18 + x];
  var sl = vec2f(r - l, u - d) * (f32(NN) / (2.0 * PATCH));
  let m = length(sl); if (m > 2.5) { sl *= 2.5 / m; }
  textureStore(surf, vec2i(wid.xy) * 16 + vec2i(lid.xy), vec4f(hs[y * 18 + x], sl, 0.0));
}`;
// a mip level from the one above: a bilinear read at the centre of each 2 x 2 block is their average
const mipWGSL = `
@group(0) @binding(0) var src: texture_2d<f32>;
@group(0) @binding(1) var sLin: sampler;
@group(0) @binding(2) var dst: texture_storage_2d<rgba16float, write>;
@compute @workgroup_size(8, 8)
fn main(@builtin(global_invocation_id) g: vec3u) {
  let ds = textureDimensions(dst);
  if (g.x >= ds.x || g.y >= ds.y) { return; }
  textureStore(dst, vec2i(g.xy), textureSampleLevel(src, sLin, (vec2f(g.xy) + 0.5) / vec2f(ds), 0.0));
}`;
// the hash lattice around the viewer (once), with the shaders' own hash12
const hashWGSL = `
@group(0) @binding(0) var dst: texture_storage_2d<rgba16float, write>;
fn hash12(p: vec2f) -> f32 { var p3 = fract(vec3f(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
@compute @workgroup_size(8, 8)
fn main(@builtin(global_invocation_id) g: vec3u) {
  let ds = textureDimensions(dst);
  if (g.x >= ds.x || g.y >= ds.y) { return; }
  textureStore(dst, vec2i(g.xy), vec4f(hash12(vec2f(g.xy) + vec2f(${HASH_O[0]}.0, ${HASH_O[1]}.0)), 0.0, 0.0, 1.0));
}`;

/* ---------- caustics: one photon per grid vertex, refracted to a horizontal plane; intensity = area before / after ---------- */
const causWGSL = FRAME + FRESNEL + `
const PATCH = ${L.toFixed(2)};

/* ---------- the sky map ---------- */
const envWGSL = FRAME + SKY + VS_OFF + `

  return vec4f(skyRadiance(vec3f(sin(th) * cos(phi), cos(th), sin(th) * sin(phi))), 1.0);

/* ---------- the visible sky at half resolution ----------
   The final pass blurs the sky by at least 1.7 pixels (defocus and haze) and reads it from the HDR frame's mip levels 1
   and 2, so full-resolution sky shading is lost there. One texel per 2 x 2 block of screen pixels, shaded for the ray
   through the block's centre; the water pass reads it back bilinearly. What is sharp it draws itself, at full
   resolution: the moon's disc, the stars, and the cumulus bank's edge (marked by the bank's mask in alpha, read back
   between 0 and 1). Texels well below the horizon are never read. */
const skyWGSL = FRAME + SKY + VIEW + VS_OFF + `
@fragment fn fs(i: VO) -> @location(0) vec4f {
  let rd = ray(i.pos.xy * 2.0);

  return skyAndBank(rd);

/* ---------- the volume's light: each caustic slice beside its own blurred average ----------
   The in-scattering loop reads the slices at full detail and at mip 3, to exaggerate the shafts against their
   surroundings. One 3D texture holds both, slice by slice (r: the slice, g: its mip-3 blur at the texel), so a step
   of the loop is one trilinear read: the hardware interpolates between slices, as the loop did by hand. */

   steps down when a frame is still running as the next one is due, and creeps back up after three seconds of
   comfortable frames. */
const FRAME_MS = 1000 / 30;
let clock = 0, lastDraw = -1, nextDraw = 0, running = true, frameNo = 0, raf = 0;
let pending = false, pendT = 0, gpuMs = 0, overN = 0, underN = 0, envAt = -1, envNight = -1, envBand = -1, dead = false;
const yaw = { v: 0 }, pitch = { v: 0 };
function render(now){
  // the clock follows real elapsed time, so the water moves at the same pace at any frame rate
  if (lastDraw < 0) lastDraw = now - FRAME_MS;
  const real = Math.min(0.5, (now - lastDraw) / 1000), dt = Math.min(0.1, real);
  lastDraw = now;
  clock += real * LOOK.speed;
  S.stats.frames++; S.stats.real = real; S.stats.clock = clock; S.stats.gpuMs = gpuMs;
  S.night += (S.targetNight - S.night) * Math.min(1, dt * 1.4);
  const n = S.night, t = clock + 30.0;
  lighting(n);
  // the pointer turns the head a little; a slow handheld drift keeps the frame alive
  yaw.v += ((-S.pointer[0]) * 0.035 - yaw.v) * Math.min(1, dt * 1.1);
  pitch.v += ((-S.pointer[1]) * 0.012 - pitch.v) * Math.min(1, dt * 1.1);
  const cam = [0.03 * Math.sin(t * 0.21), EYE + 0.015 * Math.sin(t * 0.57), 0.03 * Math.cos(t * 0.17)];
  const mw = camMath.matrixWorld(cam, basePitch + pitch.v + 0.004 * Math.sin(t * 0.47 + 2.0) + 0.002 * Math.sin(t * 1.13),
    yaw.v + 0.010 * Math.sin(t * 0.31) + 0.005 * Math.sin(t * 0.83 + 1.3), 0.004 * Math.sin(t * 0.39 + 0.4));
  // the sky map: refreshed twice a second, a quarter at a time over four frames so that no frame carries it all; in
  // full, every frame, while the theme changes
  let env = -1;
  if (Math.abs(n - envNight) > 0.01){ env = "all"; envAt = t; envNight = n; envBand = -1; }
  else if (envBand >= 0 || t - envAt > 0.5){ if (envBand < 0){ envBand = 0; envAt = t; } env = envBand; envBand = envBand === 3 ? -1 : envBand + 1; }
  uniforms(t, n, frameNo, cam, mw);
  const enc = device.createCommandEncoder();
  encodeFrame(enc, t, env);
  device.queue.submit([enc.finish()]);
  if (stamps && stamps.pending){ stamps.pending = false; readStamps(); }
  frameNo++;
  if (!pending){ pending = true; pendT = now; device.queue.onSubmittedWorkDone().then(() => { gpuMs = performance.now() - pendT; pending = false; }); }
}
function tick(now){
  if (!running || dead) return;
  raf = requestAnimationFrame(tick);
  // pace against a running target, so any refresh rate averages 30 frames a second
  const interval = (S.open ? 2 : 1) * FRAME_MS;
  if (now < nextDraw - 2) return;
  nextDraw = now - nextDraw > interval ? now + interval : nextDraw + interval;
  if (!S.open){
    if (pending){ overN++; underN = 0; }
    else if (gpuMs < FRAME_MS * 0.55){ underN++; overN = Math.max(0, overN - 1); }
    else { underN = 0; overN = Math.max(0, overN - 1); }
    if (overN > 8 && quality > 0.5){ quality = Math.max(0.5, quality * 0.85); overN = 0; frame(); }
    else if (underN > 90 && quality < 1.0){ quality = Math.min(1.0, quality * 1.08); underN = 0; frame(); }
  }
  render(now);
}
// the first frame proves the device: any error and the caller falls back to the three.js renderer
frame();
device.pushErrorScope("validation"); device.pushErrorScope("out-of-memory");
render(performance.now());
const oom = await device.popErrorScope(), bad = await device.popErrorScope();
if (bad || oom){ device.destroy(); throw new Error((bad || oom).message); }
await device.queue.onSubmittedWorkDone();
root.classList.add("gl");
addEventListener("resize", frame, { passive: true });
document.addEventListener("visibilitychange", () => {
  running = !document.hidden && !dead;
  if (running){ lastDraw = -1; nextDraw = 0; cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); }
});
// a lost device (a driver reset, the GPU taken away) hands over to the three.js renderer
device.lost.then(info => { dead = true; if (info.reason !== "destroyed" && window.A4D_FALLBACK) window.A4D_FALLBACK(); });
raf = requestAnimationFrame(tick);
if (window.A4D_DEBUG_GPU) window.__gpu = { device, textures: () => ({ surf, surf2, floorT, sliceT, envT, hdrT, hashT, skyT, volT }) };
}

</script>
<script>
/* ================= boot: the renderer =================
   WebGPU where the browser has it; otherwise, or if it fails at any point, the three.js renderer on a fresh canvas
   (a canvas keeps the first kind of context it hands out). three.js is fetched only then. ?three in the address
   asks for the three.js renderer, to compare the two. Nothing starts until the first view is up (A4D_SHOWN). */
(function(){
  const root = document.documentElement;
  let fell = false;
  function three(){
    if (fell) return; fell = true;
    const old = document.getElementById("sea"), fresh = old.cloneNode(false);
    old.replaceWith(fresh);
    const js = document.createElement("script");
    js.src = "https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js";
    js.onload = () => startGL(); js.onerror = () => root.classList.add("no-gl");
    document.head.appendChild(js);
  }
  window.A4D_FALLBACK = three;
  // after the first view is up and the statement has faded in: the text first, then the water
  const settled = new Promise(r => { const st = document.getElementById("statement"); st.addEventListener("transitionend", r, { once: true }); setTimeout(r, 900); });
  window.A4D_SHOWN.then(() => settled).then(() => setTimeout(() => {
    if (/[?&]three\b/.test(location.search) || !navigator.gpu) return three();
    startGPU(document.getElementById("sea")).catch(e => { console.warn("lagoon: WebGPU unavailable, drawing with three.js:", e && e.message); three(); });
  }, 0));
})();
</script>
<script>
/* ---------------- diagnostics: anghel4d.com/#diag ----------------
   The device, the render settings, the frame rate and the water clock, and a test of the glint maths on this
   GPU, with a copy button. Off unless the address ends in #diag (or A4D_DIAG is set), so visitors pay nothing.
   The controls exist in both languages; the readout is data in one fixed format, so readouts compare line by line. */
(function(){
let on = false;
function start(){
  if (on) return; on = true;
  const S = window.A4D_STATE, panel = document.getElementById("diag"), out = document.getElementById("diagText"), btn = document.getElementById("diagBtn");
  const copyBtn = document.getElementById("diagCopy"), note = document.getElementById("diagNote"), fall = document.getElementById("diagFall");
  document.getElementById("diagCtl").hidden = false; panel.hidden = false;
  btn.addEventListener("click", () => { panel.hidden = !panel.hidden; btn.setAttribute("aria-expanded", String(!panel.hidden)); });
  const labels = () => { panel.setAttribute("aria-label", T[lang].diagLabel); fall.setAttribute("aria-label", T[lang].diagText); };
  labels(); document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", labels));
  // the GPU, its limits, and the glint-disc maths run on it (a separate tiny context, so the scene is untouched)
  const gpu = {}, maths = [];
  try {
    const c = document.createElement("canvas"); c.width = 1; c.height = 1;
    const gl = c.getContext("webgl2", { antialias: false });
    const dbg = gl.getExtension("WEBGL_debug_renderer_info"), an = gl.getExtension("EXT_texture_filter_anisotropic");
    gpu.renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    gpu.vendor = dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR);
    gpu.ext = ["EXT_color_buffer_float", "EXT_color_buffer_half_float", "OES_texture_float_linear", "EXT_float_blend"].filter(e => gl.getExtension(e)).join(" ");
    gpu.aniso = an ? gl.getParameter(an.MAX_TEXTURE_MAX_ANISOTROPY_EXT) : 0;
    const hp = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT); gpu.highp = hp.precision;
    const vs = "#version 300 es\nin vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }";
    // 64 angles a = 0.0005 .. 0.0635 rad across the glint disc (r = 0.04: its soft edge runs from 0.032 to 0.048)
    const fs = `#version 300 es
precision highp float; out vec4 o; uniform float uR; uniform vec3 uG;
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy);
  float a = (float(c.x) + 0.5) * 0.001;
  vec3 d = normalize(vec3(sin(a) * 0.3, cos(a), sin(a) * 0.9539392014));   // a direction at angle a from uG
  float ang = acos(clamp(dot(d, uG), -1.0, 1.0));                         // as the water shader does it
  float v;
  if (c.y == 0) v = acos(cos(a));
  else if (c.y == 1) v = ang;
  else if (c.y == 2) v = smoothstep(uR * 1.2, uR * 0.8, ang);             // the disc as written: reversed edges
  else v = 1.0 - smoothstep(uR * 0.8, uR * 1.2, ang);                     // the same disc with ordered edges
  o = vec4(v, 0.0, 0.0, 1.0);
}`;
    const sh = (t, src) => { const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s); return s; };
    const pg = gl.createProgram(); gl.attachShader(pg, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pg, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pg);
    if (!gl.getProgramParameter(pg, gl.LINK_STATUS)) throw new Error("test shader did not link");
    gl.useProgram(pg);
    const W = 64, H = 4, f32 = !!gl.getExtension("EXT_color_buffer_float");
    if (f32){   // read the results back as 32-bit floats
      const tx = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tx); gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA32F, W, H);
      gl.bindFramebuffer(gl.FRAMEBUFFER, gl.createFramebuffer()); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tx, 0);
    } else { c.width = W; c.height = H; }
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.uniform1f(gl.getUniformLocation(pg, "uR"), 0.04); gl.uniform3f(gl.getUniformLocation(pg, "uG"), 0, 1, 0);
    gl.viewport(0, 0, W, H); gl.drawArrays(gl.TRIANGLES, 0, 3);
    let px;
    if (f32){ px = new Float32Array(W * H * 4); gl.readPixels(0, 0, W, H, gl.RGBA, gl.FLOAT, px); }
    else { const b8 = new Uint8Array(W * H * 4); gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, b8); px = Float32Array.from(b8, v => v / 255); }
    const ss = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };
    const ref = [x => x, x => x, x => 1 - ss(0.032, 0.048, x), x => 1 - ss(0.032, 0.048, x)];
    const names = ["acos(cos a)", "shader angle", "disc as written", "disc ordered"];
    maths.push("maths  readback " + (f32 ? "float32" : "8-bit") + ", 64 angles 0..0.064 rad, max error:");
    for (let y = 0; y < H; y++){
      let err = 0, at = 0;
      for (let x = 0; x < W; x++){ const a = (x + 0.5) * 0.001, e = Math.abs(px[(y * W + x) * 4] - ref[y](a)); if (e > err){ err = e; at = a; } }
      maths.push("  " + names[y].padEnd(16) + err.toExponential(2) + " at " + at.toFixed(4));
    }
    const pick = y => [28, 32, 36, 40, 44, 48].map(i => px[(y * W + i) * 4].toFixed(3)).join(" ");
    maths.push("  disc at .0285 .0325 .0365 .0405 .0445 .0485");
    maths.push("  written " + pick(2)); maths.push("  ordered " + pick(3));
  } catch (e) { maths.push("maths test failed: " + e.message); }
  const probe = getComputedStyle(document.getElementById("safeProbe"));
  let lastF = 0, lastC = 0, lastT = performance.now(), fps = 0, rate = 0;
  function draw(){
    const st = S.stats || {}, now = performance.now(), dtw = (now - lastT) / 1000;
    if (st.frames != null && dtw > 0){ fps = (st.frames - lastF) / dtw; rate = (st.clock - lastC) / dtw; lastF = st.frames; lastC = st.clock; lastT = now; }
    const c = document.getElementById("sea").getBoundingClientRect(), vv = window.visualViewport;
    const mm = matchMedia("(prefers-reduced-motion: reduce)").matches;
    latest = [
      "page   " + innerWidth + "x" + innerHeight + " css, dpr " + devicePixelRatio + ", screen " + screen.width + "x" + screen.height,
      "visual " + (vv ? Math.round(vv.width) + "x" + Math.round(vv.height) + " top " + Math.round(vv.offsetTop) + " scale " + vv.scale.toFixed(2) : "n/a"),
      "safe   top " + probe.paddingTop + " bottom " + probe.paddingBottom,
      "canvas " + Math.round(c.width) + "x" + Math.round(c.height) + " css at y " + Math.round(c.top) + ", buffer " + (st.buffer || []).join("x"),
      "render pr " + (st.pr || 0).toFixed(3) + ", quality " + (st.quality || 0).toFixed(3) + ", fov " + st.fov + ", aspect " + (st.aspect || 0).toFixed(3),
      "frames " + fps.toFixed(1) + " fps, water clock x" + rate.toFixed(2) + " of real time, gpu " + Math.round(st.gpuMs || 0) + " ms",
      "api    " + (st.api || "none") + (st.adapter ? ", " + st.adapter : ""),
      "passes " + (st.passMs ? Object.entries(st.passMs).map(([k, v]) => k + " " + v.toFixed(2)).join(", ") + " ms" : st.api === "webgpu" ? "not timed (no timestamp queries)" : "n/a"),
      "resize calls " + st.resizes + ", float32 targets " + st.f32 + ", reduced motion asked " + mm,
      "ua     " + navigator.userAgent,
      "gpu    " + gpu.renderer + " (" + gpu.vendor + ")",
      "ext    " + gpu.ext + ", aniso " + gpu.aniso + ", highp bits " + gpu.highp,
      ...maths
    ].join("\n");
    if (!selecting()) out.textContent = latest;   // rewriting the text would drop a selection in progress
  }
  // hold the text still while a finger is on it or part of it is selected
  let latest = "", touching = false;
  out.addEventListener("pointerdown", () => { touching = true; });
  addEventListener("pointerup", () => { touching = false; }); addEventListener("pointercancel", () => { touching = false; });
  function selecting(){
    const s = getSelection();
    return touching || !!(s && !s.isCollapsed && s.rangeCount && out.contains(s.getRangeAt(0).commonAncestorContainer));
  }
  // copy: execCommand on a selected, read-only textarea first. It runs synchronously inside the tap, which WebKit
  // needs, and works in frames that block the async clipboard. Then navigator.clipboard, still inside the tap.
  // If neither takes, the text appears in a box, selected, to copy by hand.
  function viaExec(text){
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", "");                       // read-only: no iOS keyboard
    ta.style.cssText = "position:fixed;top:0;left:-9999px;font-size:16px;border:0;padding:0;margin:0";   // 16px: no iOS zoom
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);                     // iOS needs the explicit range
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove(); getSelection().removeAllRanges();
    try { copyBtn.focus({ preventScroll: true }); } catch (e) {}
    return ok;
  }
  let noteT = 0;
  function say(t){ note.textContent = t; clearTimeout(noteT); noteT = setTimeout(() => { note.textContent = T[lang].diagLive; }, 2500); }
  function byHand(text){
    fall.value = text; fall.hidden = false;
    fall.focus({ preventScroll: true }); fall.select(); fall.setSelectionRange(0, text.length);
    say(T[lang].diagBlocked);
  }
  copyBtn.addEventListener("click", () => {
    const text = latest;
    if (viaExec(text)){ say(T[lang].diagCopied); return; }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(() => say(T[lang].diagCopied), () => byHand(text));
    } else byHand(text);
  });
  draw(); setInterval(draw, 1000);
}
if (window.A4D_DIAG || location.hash === "#diag") start();
addEventListener("hashchange", () => { if (location.hash === "#diag") start(); });
})();
</script>
