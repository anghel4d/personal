<style>
:root{
  --sky:#E6F0F3; --haze:#F2F7F8; --ink:#12313D; --ink-soft:rgba(18,49,61,.62);
  --rule:rgba(18,49,61,.22); --veil:rgba(236,245,247,.58); --focus:#0D5470;
  --serif:"Newsreader","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --pad:clamp(20px,4vw,56px);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky:#071824; --haze:#0B2230; --ink:#D7ECF2; --ink-soft:rgba(215,236,242,.62);
    --rule:rgba(215,236,242,.22); --veil:rgba(4,19,29,.55); --focus:#8FD7E4;
  }
}
:root[data-theme="dark"]{
  --sky:#071824; --haze:#0B2230; --ink:#D7ECF2; --ink-soft:rgba(215,236,242,.62);
  --rule:rgba(215,236,242,.22); --veil:rgba(4,19,29,.55); --focus:#8FD7E4;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;height:100%;overflow:hidden;color:var(--ink);
  background:linear-gradient(180deg,#A9CBE0 0%,#DCEAF1 52%,#E9F2F5 58%,#5EC3CF 58.3%,#1F93AE 78%,#0E6E8C 100%);
  font-family:var(--serif);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
canvas#sea{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
a{color:inherit}
:focus-visible{outline:1.5px solid var(--focus);outline-offset:4px;border-radius:2px}

/* corner chrome */
.chrome{position:fixed;z-index:6;font-family:var(--mono);font-size:12.5px;letter-spacing:.02em;color:var(--ink)}
.chrome button,.chrome a{font:inherit;color:inherit;background:none;border:0;padding:10px 6px;margin:-10px -6px;cursor:pointer;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.chrome button:hover,.chrome a:hover{color:var(--ink-soft)}
.tl{top:calc(var(--pad) + env(safe-area-inset-top,0px));left:var(--pad)}
.tr{top:calc(var(--pad) + env(safe-area-inset-top,0px));right:var(--pad)}
.bl{bottom:calc(var(--pad) + env(safe-area-inset-bottom,0px));left:var(--pad)}
.br{bottom:calc(var(--pad) + env(safe-area-inset-bottom,0px));right:var(--pad);display:flex;gap:28px}
.mark{display:block;width:46px;height:46px}
.sep{opacity:.35}
.lang [aria-pressed="true"]{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.lang{display:flex;gap:10px}

/* statement */
.statement{
  position:fixed;z-index:2;left:50%;transform:translateX(-50%);
  bottom:calc(42vh + 3.2vh);width:min(92vw,980px);margin:0;text-align:center;
  font-family:var(--serif);font-style:italic;font-weight:400;
  font-size:clamp(22px,2.55vw,38px);line-height:1.28;letter-spacing:-.005em;
  font-variation-settings:"opsz" 40;
  text-shadow:0 0 28px var(--haze);
  opacity:0;filter:blur(6px);transition:opacity 2.2s ease .35s,filter 2.2s ease .35s;
}
.ready .statement{opacity:1;filter:blur(0)}
.statement a,.panel a.inline{text-decoration:underline dotted;text-decoration-thickness:1px;text-underline-offset:.18em}
.statement a:hover{text-decoration-style:solid}

/* veil + panels */
.veil{position:fixed;inset:0;z-index:4;background:var(--veil);
  -webkit-backdrop-filter:blur(18px) saturate(1.15);backdrop-filter:blur(18px) saturate(1.15);
  opacity:0;pointer-events:none;transition:opacity .6s ease}
.open .veil{opacity:1;pointer-events:auto}
.layer{position:fixed;inset:0;z-index:5;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(var(--pad) + 64px + env(safe-area-inset-top,0px)) var(--pad) calc(var(--pad) + 72px + env(safe-area-inset-bottom,0px))}
.layer.on{display:block}
.panel.on{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 calc(var(--pad) + 70px),#000 calc(100% - var(--pad) - 80px),transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 calc(var(--pad) + 70px),#000 calc(100% - var(--pad) - 80px),transparent 100%)}
.layer > .inner{opacity:0;transform:translateY(8px);transition:opacity .55s ease .1s,transform .55s ease .1s}
.layer.shown > .inner{opacity:1;transform:none}
.close{position:fixed;z-index:6}

nav.menu .inner{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.2vh,22px)}
nav.menu a{font-style:italic;font-size:clamp(34px,5.4vw,68px);line-height:1.1;text-decoration:none;font-variation-settings:"opsz" 72;font-weight:300}
nav.menu a:hover{text-decoration:underline dotted;text-decoration-thickness:1px;text-underline-offset:.16em}
nav.menu .ext{font-family:var(--mono);font-style:normal;font-size:12.5px;margin-top:clamp(18px,4vh,40px);display:flex;gap:28px;font-weight:400}
nav.menu .ext a{font-family:var(--mono);font-style:normal;font-size:12.5px;font-weight:400}

.panel .inner{max-width:62ch;margin:0 auto;font-size:clamp(17px,1.25vw,19.5px);line-height:1.6;font-variation-settings:"opsz" 14}
.panel h1{font-weight:300;font-style:italic;font-size:clamp(36px,4.4vw,56px);line-height:1.05;margin:0 0 .9em;font-variation-settings:"opsz" 72;letter-spacing:-.01em}
.panel p{margin:0 0 1.05em}
.panel .work{list-style:none;margin:0;padding:0}
.panel .work li{padding:1.15em 0 1.25em;border-top:1px solid var(--rule)}
.panel .work li:last-child{border-bottom:1px solid var(--rule)}
.panel h2{font-weight:400;font-size:1.32em;margin:0 0 .15em;line-height:1.2}
.panel h2 .jp{font-style:normal;font-size:.8em;margin-left:.35em;opacity:.7}
.panel .when{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft);margin:0 0 .55em;font-style:normal;letter-spacing:.01em}
.panel .links{font-family:var(--mono);font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:.4em}
.panel .links a{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;text-decoration-color:var(--rule)}
.panel .links a:hover{text-decoration-color:currentColor}
.panel .try{margin:.75em 0 0;padding:.7em 0 .1em;border-top:1px dotted var(--rule);font-style:italic}
.panel .earlier{margin-top:1.6em;color:var(--ink-soft)}
.panel blockquote{margin:1.6em 0;padding:0 0 0 1.1em;border-left:1px solid var(--ink);font-style:italic;font-size:1.06em;line-height:1.55}
.panel .contact a{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px;text-decoration-color:var(--rule)}
.panel .contact a:hover{text-decoration-color:currentColor}
.panel .contact .big{font-style:italic;font-size:clamp(26px,3vw,38px);font-variation-settings:"opsz" 60;font-weight:300;display:inline-block;margin:.2em 0 .6em}

.open .statement{opacity:0;filter:blur(6px);transition:opacity .5s ease,filter .5s ease}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:640px){
  .statement{bottom:calc(42vh + 2.5vh);font-size:clamp(21px,6vw,27px);line-height:1.3}
  .br{gap:18px}
  .chrome{font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  .statement,.layer > .inner,.veil{transition:none}
}
</style>
<style>
canvas#sea{opacity:0;transition:opacity 1.6s ease}
body,.chrome,.statement{transition:color 1.2s ease}
.ready .statement{transition:opacity 2.2s ease .35s,filter 2.2s ease .35s,color 1.2s ease}
.gl canvas#sea{opacity:1}
.statement{text-shadow:0 0 34px rgba(230,240,244,.55)}
:root[data-theme="dark"] .statement{text-shadow:0 0 30px rgba(4,19,29,.55)}
</style>

  layers.forEach(l => { const el = document.getElementById(l); el.classList.remove("shown"); el.classList.remove("on"); });

  show(id);
}
document.addEventListener("click", e => {
  const a = e.target.closest("[data-go]"); if (!a) return;
  e.preventDefault(); go(a.dataset.go);
});

/* ---------------- theme ---------------- */
const root = document.documentElement;

const modes = ["day","night","auto"];
let mode = modes.includes(load("a4d-mode")) ? load("a4d-mode") : "day";
const mq = matchMedia("(prefers-color-scheme: dark)");
function isNight(){
  if (mode === "night") return true;
  if (mode === "day") return false;
  const vt = viewerTheme;
  if (vt === "dark") return true; if (vt === "light") return false;
  return mq.matches;
}
function applyTheme(){
  if (mode === "auto"){ if (viewerTheme) root.setAttribute("data-theme", viewerTheme); else root.removeAttribute("data-theme"); }
  else root.setAttribute("data-theme", mode === "night" ? "dark" : "light");
  const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = isNight() ? "#071824" : "#E6F0F3";

  updateThemeLabel();
}
function updateThemeLabel(){ const b = document.getElementById("themeBtn"); b.textContent = T[lang][mode]; b.setAttribute("aria-label", "Theme: " + mode); }
document.getElementById("themeBtn").addEventListener("click", () => { mode = modes[(modes.indexOf(mode) + 1) % 3]; store("a4d-mode", mode); applyTheme(); });
mq.addEventListener && mq.addEventListener("change", applyTheme);

/* ---------------- boot ---------------- */
lang = load("a4d-lang") === "fr" ? "fr" : (navigator.language || "").toLowerCase().startsWith("fr") && !load("a4d-lang") ? "fr" : "en";
applyTheme(); S.night = S.targetNight;
render();
const h0 = location.hash.slice(1); if (["work","about","contact","menu"].includes(h0)) show(h0);
requestAnimationFrame(() => setTimeout(() => body.classList.add("ready"), 60));

<script>
/* ================= the lagoon: three.js ================= */
(function(){
if (!window.THREE) { document.documentElement.classList.add("no-gl"); return; }
const canvas = document.getElementById("sea");
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: "high-performance", stencil: false });
} catch (e) { document.documentElement.classList.add("no-gl"); return; }
const GL2 = renderer.capabilities.isWebGL2;
const half = (GL2 || renderer.extensions.has("OES_texture_half_float")) ? THREE.HalfFloatType : THREE.UnsignedByteType;
renderer.autoClear = false;
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputEncoding = THREE.LinearEncoding;

const S = window.A4D_STATE;            // shared with the UI: night (0..1), pointer, reduce, open
const L = 2.5, CDEPTH = 1.6, AMP = 1.45;

/* ---------- shared GLSL ---------- */
const WAVES = `
uniform float uTime;
const float TILE = ${L.toFixed(2)};
const float AMP = ${AMP.toFixed(2)};
vec3 detailWaves(vec2 x, float t){
  const float TAU = 6.28318530718;
  float h = 0.0; vec2 g = vec2(0.0);
  vec2 M[10]; float A[10];
  M[0]=vec2( 2.0, 3.0); A[0]=1.00;  M[1]=vec2( 3.0,-2.0); A[1]=0.95;
  M[2]=vec2(-4.0, 1.0); A[2]=0.80;  M[3]=vec2( 1.0,-5.0); A[3]=0.62;
  M[4]=vec2( 5.0, 4.0); A[4]=0.45;  M[5]=vec2(-6.0,-3.0); A[5]=0.36;
  M[6]=vec2( 7.0,-1.0); A[6]=0.30;  M[7]=vec2(-2.0, 7.0); A[7]=0.26;
  M[8]=vec2( 8.0, 5.0); A[8]=0.18;  M[9]=vec2(-9.0, 4.0); A[9]=0.15;
  for (int i = 0; i < 10; i++){
    vec2 k = M[i] * (TAU / TILE);
    float kl = length(k);
    float w = sqrt(9.81 * kl) * 0.35;
    float ph = dot(k, x) - w * t + float(i) * 2.399;
    float a = A[i] * AMP / (kl * kl);
    h += a * sin(ph);
    g += a * cos(ph) * k;
  }
  return vec3(h, g);
}
// non-repeating ripples for the visible surface
vec2 rippleGrad(vec2 x, float t){
  vec2 g = vec2(0.0);
  float ang = 0.37;
  float lam = 3.1;
  for (int i = 0; i < 9; i++){
    vec2 d = vec2(cos(ang), sin(ang));
    float k = 6.28318530718 / lam;
    float w = sqrt(9.81 * k) * 0.42;
    float a = lam * 0.0088;
    g += a * k * cos(dot(d, x) * k - w * t + float(i) * 1.618) * d;
    ang += 2.39996;
    lam *= 0.74;
  }
  return g;
}
// long, slow swells that move the actual geometry
vec3 swell(vec2 x, float t, out vec2 grad){
  vec2 D[4]; float K[4]; float A[4];
  D[0]=normalize(vec2(0.25,-1.0)); K[0]=0.16; A[0]=0.075;
  D[1]=normalize(vec2(-0.7,-1.0)); K[1]=0.29; A[1]=0.040;
  D[2]=normalize(vec2(0.9,-0.6));  K[2]=0.47; A[2]=0.022;
  D[3]=normalize(vec2(-0.2,-1.0)); K[3]=0.83; A[3]=0.012;
  vec3 disp = vec3(0.0); grad = vec2(0.0);
  for (int i = 0; i < 4; i++){
    float w = sqrt(9.81 * K[i]);
    float ph = dot(D[i], x) * K[i] - w * t * 0.55 + float(i) * 1.3;
    float s = sin(ph), c = cos(ph);
    disp.y += A[i] * s;
    disp.xz += D[i] * (A[i] * 0.55) * c;      // Gerstner: crests sharpen slightly
    grad += A[i] * K[i] * c * D[i];
  }
  return disp;
}
`;
const SKY = `
uniform float uNight;
uniform vec3 uSun;        // direction toward the sun or moon
uniform vec3 uSunCol;     // its radiance scale (HDR)
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec3 skyColor(vec3 d){
  float h = clamp(d.y, 0.0, 1.0);
  vec3 zD = vec3(0.095, 0.300, 0.650), hD = vec3(0.500, 0.720, 0.860), hazeD = vec3(0.745, 0.870, 0.930);
  vec3 zN = vec3(0.0016, 0.0050, 0.0140), hN = vec3(0.0100, 0.0290, 0.0500), hazeN = vec3(0.020, 0.050, 0.075);
  vec3 z = mix(zD, zN, uNight), hz = mix(hD, hN, uNight), haze = mix(hazeD, hazeN, uNight);
  vec3 c = mix(hz, z, pow(h, 0.48));
  c = mix(c, haze, exp(-h * 16.0) * 0.82);
  float mu = dot(d, uSun);
  float m = max(mu, 0.0);
  c += uSunCol * (0.010 * pow(m, 5.0) + mix(0.045, 0.030, uNight) * pow(m, 48.0) + mix(0.35, 0.12, uNight) * pow(m, 700.0));
  float disc = smoothstep(mix(0.99988, 0.99992, uNight), mix(0.99994, 0.99996, uNight), mu);
  c += uSunCol * disc * mix(24.0, 2.6, uNight);
  return c;
}
`;

/* ---------- caustics: refract a light mesh through the waves, measure how much each triangle shrinks ---------- */
const CRES = Math.min(innerWidth, innerHeight) < 700 ? 512 : 1024;
const causticRT = new THREE.WebGLRenderTarget(CRES, CRES, {
  type: half, wrapS: THREE.RepeatWrapping, wrapT: THREE.RepeatWrapping,
  minFilter: THREE.LinearMipmapLinearFilter, magFilter: THREE.LinearFilter, generateMipmaps: true, depthBuffer: false
});
const CGAIN = half === THREE.UnsignedByteType ? 0.25 : 1.0;
const cPlane = new THREE.PlaneGeometry(1, 1, 200, 200);
const cGeo = new THREE.InstancedBufferGeometry();
cGeo.index = cPlane.index; cGeo.setAttribute("position", cPlane.getAttribute("position"));
const offs = []; for (let y = -1; y <= 1; y++) for (let x = -1; x <= 1; x++) offs.push(x, y);
cGeo.setAttribute("aOff", new THREE.InstancedBufferAttribute(new Float32Array(offs), 2)); cGeo.instanceCount = 9;
const cMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uIOR: { value: 1.333 }, uMask: { value: new THREE.Vector3(1, 0, 0) }, uLight: { value: new THREE.Vector3(0, -1, 0) }, uGain: { value: CGAIN } },
  vertexShader: WAVES + `
    uniform float uIOR; uniform vec3 uLight;
    attribute vec2 aOff; varying vec2 vOld; varying vec2 vNew;
    void main(){
      vec2 x = (position.xy + 0.5) * TILE;
      vec3 w = detailWaves(x, uTime);
      vec3 n = normalize(vec3(-w.y, 1.0, -w.z));
      vec3 r = refract(uLight, n, 1.0 / uIOR);
      vec3 r0 = refract(uLight, vec3(0.0, 1.0, 0.0), 1.0 / uIOR);
      vec2 land = x + (r.xz / (-r.y) - r0.xz / (-r0.y)) * ${CDEPTH.toFixed(2)};
      vOld = x; vNew = land;
      gl_Position = vec4((land / TILE + aOff) * 2.0 - 1.0, 0.0, 1.0);
    }`,
  fragmentShader: `
    uniform vec3 uMask; uniform float uGain; varying vec2 vOld; varying vec2 vNew;
    void main(){
      float oa = abs(dFdx(vOld.x) * dFdy(vOld.y) - dFdx(vOld.y) * dFdy(vOld.x));
      float na = abs(dFdx(vNew.x) * dFdy(vNew.y) - dFdx(vNew.y) * dFdy(vNew.x));
      gl_FragColor = vec4(uMask * min(oa / max(na, 1e-9), 14.0) * uGain, 1.0);
    }`,
  blending: THREE.CustomBlending, blendEquation: THREE.AddEquation, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
  depthTest: false, depthWrite: false, transparent: true, extensions: { derivatives: true }
});
const cMesh = new THREE.Mesh(cGeo, cMat); cMesh.frustumCulled = false;
const cScene = new THREE.Scene(); cScene.add(cMesh);
const cCam = new THREE.Camera();
const IOR = [1.322, 1.333, 1.346], MASK = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
function renderCaustics(){
  renderer.setRenderTarget(causticRT);
  renderer.setClearColor(0x000000, 1); renderer.clear(true, false, false);
  for (let i = 0; i < 3; i++){ cMat.uniforms.uIOR.value = IOR[i]; cMat.uniforms.uMask.value.set(MASK[i][0], MASK[i][1], MASK[i][2]); renderer.render(cScene, cCam); }
  renderer.setRenderTarget(null);
}

/* ---------- the visible world ---------- */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.1, 6000);
camera.position.set(0, 3.1, 0);

// sky dome
const skyMat = new THREE.ShaderMaterial({
  uniforms: { uNight: { value: 0 }, uSun: { value: new THREE.Vector3() }, uSunCol: { value: new THREE.Vector3() }, uTime: { value: 0 } },
  vertexShader: `varying vec3 vDir; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vDir = w.xyz - cameraPosition; gl_Position = projectionMatrix * viewMatrix * w; gl_Position.z = gl_Position.w; }`,
  fragmentShader: SKY + `
    uniform float uTime; varying vec3 vDir;
    void main(){
      vec3 d = normalize(vDir);
      vec3 c = skyColor(d);
      vec2 sp = floor(gl_FragCoord.xy / 1.5 + vec2(11.0, 7.0));
      float st = step(0.9991, hash12(sp * 1.37 + 0.71)) * smoothstep(0.02, 0.35, d.y);
      c += uNight * st * 0.5 * (0.65 + 0.35 * sin(uTime * 1.7 + hash12(sp + 3.1) * 40.0));
      gl_FragColor = vec4(c, 1.0);
    }`,
  side: THREE.BackSide, depthWrite: false
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(5000, 48, 24), skyMat);
sky.renderOrder = -1; scene.add(sky);

// water surface: a grid whose rows get exponentially further apart, so triangles stay roughly pixel-sized
function waterGeometry(rows, cols){
  const pos = [], idx = [];
  const near = 0.6, far = 4200;
  for (let j = 0; j <= rows; j++){
    const t = j / rows;
    const d = near * Math.pow(far / near, t);
    const half = d * 2.4 + 2.0;
    for (let i = 0; i <= cols; i++){
      const u = i / cols;
      pos.push((u * 2 - 1) * half, 0, -d);
    }
  }
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++){
    const a = j * (cols + 1) + i, b = a + 1, c = a + cols + 1, e = c + 1;
    idx.push(a, c, b, b, c, e);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  return g;
}
const waterMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 }, uNight: { value: 0 }, uSun: { value: new THREE.Vector3() }, uSunCol: { value: new THREE.Vector3() },
    uCaustics: { value: causticRT.texture }, uCGain: { value: 1.0 / CGAIN }, uRes: { value: new THREE.Vector2(1, 1) }
  },
  vertexShader: WAVES + `
    varying vec3 vWorld;
    void main(){
      vec3 p = (modelMatrix * vec4(position, 1.0)).xyz;
      float d = length(p.xz - cameraPosition.xz);
      vec2 gdummy;
      vec3 s = swell(p.xz, uTime, gdummy) * smoothstep(1800.0, 300.0, d);
      p += s;
      vWorld = p;
      gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
    }`,
  fragmentShader: WAVES + SKY + `
    uniform sampler2D uCaustics; uniform float uCGain; uniform vec2 uRes;
    varying vec3 vWorld;
    const vec3 SIGMA = vec3(0.62, 0.115, 0.052);     // absorption + scattering per metre: red goes first
    float floorDepth(vec2 x){
      float r = max(-x.y, 0.0);
      float d = 1.25 + 0.024 * r + 0.00009 * r * r;
      d += 0.10 * sin(x.x * 0.21 + 1.3) * sin(x.y * 0.17) + 0.05 * sin(x.x * 0.53 - x.y * 0.41);
      return min(d, 18.0);
    }
    vec3 sand(vec2 x){
      float rip = sin(dot(x, vec2(0.83, 0.56)) * 9.0 + sin(x.x * 1.7) * 1.4) * 0.5 + 0.5;
      float n = hash12(floor(x * 18.0));
      float pch = 0.5 + 0.5 * sin(x.x * 0.35 + sin(x.y * 0.27) * 2.0) * sin(x.y * 0.31);
      vec3 a = vec3(0.70, 0.63, 0.48);
      a *= 0.86 + 0.10 * rip + 0.05 * n;
      a = mix(a, a * vec3(0.78, 0.84, 0.80), smoothstep(0.65, 0.95, pch) * 0.6);
      return a;
    }
    void main(){
      vec3 P = vWorld;
      vec3 toP = P - cameraPosition;
      float dist = length(toP);
      vec3 V = toP / dist;

      // surface normal: swell + periodic detail ripples, softened with distance so far water does not shimmer into noise
      vec2 gs; swell(P.xz, uTime, gs);
      float fine = exp(-dist * 0.030);
      float px = dist * 0.0012;                         // rough pixel footprint
      vec2 g = gs + rippleGrad(P.xz, uTime) * mix(0.07, 1.0, fine);
      // micro ripples
      vec2 q = P.xz * 7.0;
      float t = uTime;
      vec2 mr = vec2(cos(q.x * 1.1 + q.y * 0.6 + t * 2.1) + 0.6 * cos(q.x * -0.7 + q.y * 1.7 - t * 1.6),
                     cos(q.y * 1.3 - q.x * 0.4 + t * 1.8) + 0.6 * cos(q.y * -0.9 + q.x * 1.5 + t * 2.4));
      g += mr * 0.012 * exp(-dist * 0.09);
      g *= 1.0 / (1.0 + px * 6.0);
      vec3 N = normalize(vec3(-g.x, 1.0, -g.y));

      float cosV = clamp(dot(N, -V), 0.0, 1.0);
      float F = 0.02 + 0.98 * pow(1.0 - cosV, 5.0);
      vec3 R = reflect(V, N); R.y = abs(R.y) + 0.002;
      vec3 refl = skyColor(normalize(R));

      // looking into the water
      vec3 T = refract(V, N, 1.0 / 1.333);
      float d0 = floorDepth(P.xz);
      float tt = d0 / max(-T.y, 0.06);
      vec3 B = P + T * tt;
      float d1 = floorDepth(B.xz);
      tt = d1 / max(-T.y, 0.06);
      B = P + T * tt;

      // light: sun or moon, refracted at a flat surface for the bulk path
      vec3 Ld = -uSun;
      vec3 Lr = refract(Ld, vec3(0.0, 1.0, 0.0), 1.0 / 1.333);
      float lcos = max(-Lr.y, 0.25);
      vec3 sunIn = uSunCol * max(uSun.y, 0.0) * 0.96;
      vec3 amb = mix(vec3(0.30, 0.46, 0.60), vec3(0.006, 0.016, 0.030), uNight);

      // caustics on the floor: the texture was built for a fixed depth, so deeper floors read it blurred
      vec2 cuv = (B.xz - Lr.xz / lcos * d1) / TILE;
      float defocus = clamp(abs(d1 - ${CDEPTH.toFixed(2)}) * 0.9, 0.0, 5.0);
      vec2 cuv2 = mat2(0.82, -0.57, 0.57, 0.82) * cuv * 1.31 + vec2(0.37, 0.71);
      vec3 caus = (texture2D(uCaustics, cuv, defocus).rgb + texture2D(uCaustics, cuv2, defocus).rgb) * 0.5 * uCGain;
      caus = pow(caus, vec3(1.6)) * 1.08;
      caus = mix(vec3(1.0), caus, exp(-max(d1 - ${CDEPTH.toFixed(2)}, 0.0) * 0.18));

      vec3 Tl = exp(-SIGMA * d1 / lcos);
      vec3 Tv = exp(-SIGMA * tt);
      vec3 floorLit = sand(B.xz) * (sunIn * Tl * caus * 1.35 + amb * Tl * 0.7);

      // light scattered toward the eye by the water itself
      vec3 albedo = vec3(0.012, 0.30, 0.46);
      vec3 inscat = albedo * (sunIn * 0.55 + amb * 1.15) * (1.0 - Tv);

      // shimmering shafts: sample the caustic field through the water column
      vec3 shafts = vec3(0.0);
      float jit = hash12(gl_FragCoord.xy + fract(uTime) * 61.0);
      for (int i = 0; i < 7; i++){
        float s = (float(i) + jit) / 7.0;
        vec3 Sp = P + T * tt * s;
        float ds = max(-Sp.y + P.y, 0.0);
        vec2 suv = (Sp.xz - Lr.xz / lcos * ds) / TILE;
        float fz = clamp(abs(ds - ${CDEPTH.toFixed(2)}) * 1.3, 0.0, 5.0) + 1.0;
        float c = texture2D(uCaustics, suv, fz).g * uCGain;
        float att = exp(-0.11 * (ds / lcos + tt * s));
        shafts += vec3(max(c - 0.8, 0.0)) * att;
      }
      float cosS = dot(-T, Lr);                       // forward scattering toward the eye
      float phase = 0.35 + 1.6 * pow(max(-cosS, 0.0), 6.0) + 0.6 * pow(max(cosS, 0.0), 3.0);
      shafts *= sunIn * vec3(0.10, 0.70, 0.80) * phase * min(tt, 6.0) / 7.0 * 0.11;

      vec3 under = floorLit * Tv + inscat + shafts;
      vec3 col = mix(under, refl, F);

      // haze into the horizon
      float fog = 1.0 - exp(-dist * 0.0018);
      vec3 hzc = skyColor(normalize(vec3(V.x, 0.015, V.z)));
      col = mix(col, hzc, pow(fog, 1.25));
      gl_FragColor = vec4(col, 1.0);
    }`,
  extensions: { derivatives: true }, side: THREE.DoubleSide
});
const water = new THREE.Mesh(waterGeometry(280, 260), waterMat);
water.frustumCulled = false; scene.add(water);

/* ---------- post: bloom, then filmic tone mapping, grain and a soft vignette ---------- */
const rt = new THREE.WebGLRenderTarget(2, 2, { type: half });
const composer = new THREE.EffectComposer(renderer, rt);
composer.addPass(new THREE.RenderPass(scene, camera));
const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(2, 2), 0.42, 0.62, 0.92);
composer.addPass(bloom);
const finalPass = new THREE.ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uExposure: { value: 1.0 }, uNight: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime; uniform float uExposure; uniform float uNight; varying vec2 vUv;
    vec3 aces(vec3 x){ return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
    float h(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb * uExposure;
      c = aces(c);
      c = pow(c, vec3(1.0 / 2.2));
      vec2 q = vUv - 0.5;
      c *= 1.0 - mix(0.10, 0.22, uNight) * pow(length(q * vec2(1.0, 1.15)) * 1.25, 2.4);
      c += (h(gl_FragCoord.xy + fract(uTime * 17.0) * 97.0) - 0.5) * mix(0.022, 0.03, uNight);
      gl_FragColor = vec4(c, 1.0);
    }`
});
composer.addPass(finalPass);

/* ---------- sizing, framing, adaptive quality ---------- */
let quality = 1.0;
function frame(){
  const w = innerWidth, h = innerHeight;
  const small = Math.min(w, h) < 700;
  const pr = Math.min(devicePixelRatio || 1, small ? 1.5 : 1.75) * quality * (small ? 0.8 : 0.85);
  renderer.setPixelRatio(pr);
  renderer.setSize(w, h, false);
  composer.setPixelRatio(pr);
  composer.setSize(w, h);
  bloom.resolution.set(w * pr * 0.5, h * pr * 0.5);
  camera.aspect = w / h;
  camera.fov = small && w < h ? 58 : 46;
  // keep the camera level and slide the projection so the horizon sits 58% down the screen
  const shift = -0.16 * h * 0.5;
  camera.setViewOffset(w, h, 0, shift, w, h);
  camera.updateProjectionMatrix();
}
frame();
addEventListener("resize", frame, { passive: true });

const sunDay = new THREE.Vector3(0.36, Math.sin(31 * Math.PI / 180), -0.82).normalize();
const moon = new THREE.Vector3(-0.28, Math.sin(19 * Math.PI / 180), -0.92).normalize();
const sunColDay = new THREE.Vector3(1.0, 0.94, 0.84).multiplyScalar(3.4);
const moonCol = new THREE.Vector3(0.62, 0.78, 0.95).multiplyScalar(0.55);
const sunNow = new THREE.Vector3(), colNow = new THREE.Vector3();

let clock = 0, last = performance.now(), running = true, slow = 0, fast = 0, skip = false;
document.addEventListener("visibilitychange", () => { running = !document.hidden; if (running){ last = performance.now(); requestAnimationFrame(tick); } });
const yaw = { v: 0 }, pitch = { v: 0 };
function tick(now){
  if (!running) return;
  const raw = (now - last) / 1000; last = now;
  const dt = Math.min(0.05, raw);
  if (raw > 0.030){ if (++slow > 24 && quality > 0.5){ quality = Math.max(0.5, quality - 0.15); slow = 0; frame(); } }
  else if (raw < 0.0145){ if (++fast > 300 && quality < 1.0){ quality = Math.min(1.0, quality + 0.1); fast = 0; frame(); } }
  if (S.open){ skip = !skip; if (skip){ requestAnimationFrame(tick); return; } }

  clock += dt * (S.reduce ? 0.12 : 1.0);
  S.night += (S.targetNight - S.night) * Math.min(1, dt * 1.4);
  const n = S.night;
  sunNow.copy(sunDay).lerp(moon, n).normalize();
  colNow.copy(sunColDay).lerp(moonCol, n);

  yaw.v += ((-S.pointer[0]) * 0.035 - yaw.v) * Math.min(1, dt * 1.1);
  pitch.v += ((-S.pointer[1]) * 0.012 - pitch.v) * Math.min(1, dt * 1.1);
  camera.rotation.set(pitch.v, yaw.v, 0, "YXZ");

  const T = clock + 30.0;
  cMat.uniforms.uTime.value = T;
  cMat.uniforms.uLight.value.copy(sunNow).negate();
  for (const m of [waterMat, skyMat]){
    m.uniforms.uTime.value = T; m.uniforms.uNight.value = n;
    m.uniforms.uSun.value.copy(sunNow); m.uniforms.uSunCol.value.copy(colNow);
  }
  finalPass.uniforms.uTime.value = T; finalPass.uniforms.uNight.value = n;
  finalPass.uniforms.uExposure.value = 1.0 + n * 0.6;
  bloom.strength = 0.42 + n * 0.12;
  bloom.threshold = 0.92 + n * 0.25;

  renderCaustics();
  composer.render(dt);
  requestAnimationFrame(tick);
}
document.documentElement.classList.add("gl");
requestAnimationFrame(t => { last = t; tick(t); });
})();

</script>
</body>
</html>
