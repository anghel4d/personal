<style>
:root{
  --sky:#E6F0F3; --haze:#F2F7F8; --ink:#12313D; --ink-soft:rgba(18,49,61,.62);
  --rule:rgba(18,49,61,.22); --veil:rgba(236,245,247,.58); --focus:#0D5470;
  --serif:"Newsreader","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --pad:clamp(20px,4vw,56px);
  --scene:linear-gradient(180deg,#6FB8DE 0%,#7CC0E2 30%,#B6D3E2 37%,#AEC7D7 38%,#9FC0D6 38.3%,#6FA5CA 46%,#3B9EC7 65%,#22AFC3 100%);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky:#071824; --haze:#0B2230; --ink:#D7ECF2; --ink-soft:rgba(215,236,242,.62);
    --rule:rgba(215,236,242,.22); --veil:rgba(4,19,29,.55); --focus:#8FD7E4;
    --scene:linear-gradient(180deg,#071F4A 0%,#0A2A5C 30%,#12395F 37%,#0A3562 38%,#073662 38.3%,#01224C 46%,#00113D 70%,#000F31 100%);
  }
}
:root[data-theme="dark"]{
  --sky:#071824; --haze:#0B2230; --ink:#D7ECF2; --ink-soft:rgba(215,236,242,.62);
  --rule:rgba(215,236,242,.22); --veil:rgba(4,19,29,.55); --focus:#8FD7E4;
  --scene:linear-gradient(180deg,#071F4A 0%,#0A2A5C 30%,#12395F 37%,#0A3562 38%,#073662 38.3%,#01224C 46%,#00113D 70%,#000F31 100%);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;height:100%;overflow:hidden;color:var(--ink);
  background:var(--scene);
  font-family:var(--serif);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
canvas#sea{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
a{color:inherit}
:focus-visible{outline:1.5px solid var(--focus);outline-offset:4px;border-radius:2px}

/* corner chrome */
.chrome{position:fixed;z-index:6;font-family:var(--mono);font-size:12.5px;letter-spacing:.02em;color:var(--ink)}
.chrome button,.chrome a{font:inherit;color:inherit;background:none;border:0;padding:10px 6px;margin:-10px -6px;cursor:pointer;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.chrome button:hover,.chrome a:hover{color:var(--ink-soft)}
.tl{top:calc(var(--pad) + env(safe-area-inset-top,0px));left:var(--pad)}
.tr{top:calc(var(--pad) + env(safe-area-inset-top,0px));right:var(--pad)}
.bl{bottom:calc(var(--pad) + env(safe-area-inset-bottom,0px));left:var(--pad)}
.br{bottom:calc(var(--pad) + env(safe-area-inset-bottom,0px));right:var(--pad);display:flex;gap:28px}
.mark{display:block;width:46px;height:46px}
.sep{opacity:.35}
.lang [aria-pressed="true"]{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.lang{display:flex;gap:10px}

/* statement */
.statement{
  position:fixed;z-index:2;left:50%;transform:translateX(-50%);
  bottom:calc(62vh + 3.2vh);width:min(92vw,980px);margin:0;text-align:center;
  font-family:var(--serif);font-style:italic;font-weight:400;
  font-size:clamp(22px,2.55vw,38px);line-height:1.28;letter-spacing:-.005em;
  font-variation-settings:"opsz" 40;
  text-shadow:0 0 28px var(--haze);
  opacity:0;filter:blur(6px);transition:opacity 2.2s ease .35s,filter 2.2s ease .35s;
}
.ready .statement{opacity:1;filter:blur(0)}
.statement a,.panel a.inline{text-decoration:underline dotted;text-decoration-thickness:1px;text-underline-offset:.18em}
.statement a:hover{text-decoration-style:solid}

/* veil + panels */
.veil{position:fixed;inset:0;z-index:4;background:var(--veil);
  -webkit-backdrop-filter:blur(18px) saturate(1.15);backdrop-filter:blur(18px) saturate(1.15);
  opacity:0;pointer-events:none;transition:opacity .6s ease}
.open .veil{opacity:1;pointer-events:auto}
.layer{position:fixed;inset:0;z-index:5;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(var(--pad) + 64px + env(safe-area-inset-top,0px)) var(--pad) calc(var(--pad) + 72px + env(safe-area-inset-bottom,0px))}
.layer.on{display:block}
.panel.on{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 calc(var(--pad) + 70px),#000 calc(100% - var(--pad) - 80px),transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 calc(var(--pad) + 70px),#000 calc(100% - var(--pad) - 80px),transparent 100%)}
.layer > .inner{opacity:0;transform:translateY(8px);transition:opacity .55s ease .1s,transform .55s ease .1s}
.layer.shown > .inner{opacity:1;transform:none}
.close{position:fixed;z-index:6}

nav.menu .inner{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.2vh,22px)}
nav.menu a{font-style:italic;font-size:clamp(34px,5.4vw,68px);line-height:1.1;text-decoration:none;font-variation-settings:"opsz" 72;font-weight:300}
nav.menu a:hover{text-decoration:underline dotted;text-decoration-thickness:1px;text-underline-offset:.16em}
nav.menu .ext{font-family:var(--mono);font-style:normal;font-size:12.5px;margin-top:clamp(18px,4vh,40px);display:flex;gap:28px;font-weight:400}
nav.menu .ext a{font-family:var(--mono);font-style:normal;font-size:12.5px;font-weight:400}

.panel .inner{max-width:62ch;margin:0 auto;font-size:clamp(17px,1.25vw,19.5px);line-height:1.6;font-variation-settings:"opsz" 14}
.panel h1{font-weight:300;font-style:italic;font-size:clamp(36px,4.4vw,56px);line-height:1.05;margin:0 0 .9em;font-variation-settings:"opsz" 72;letter-spacing:-.01em}
.panel p{margin:0 0 1.05em}
.panel .work{list-style:none;margin:0;padding:0}
.panel .work li{padding:1.15em 0 1.25em;border-top:1px solid var(--rule)}
.panel .work li:last-child{border-bottom:1px solid var(--rule)}
.panel h2{font-weight:400;font-size:1.32em;margin:0 0 .15em;line-height:1.2}
.panel h2 .jp{font-style:normal;font-size:.8em;margin-left:.35em;opacity:.7}
.panel .when{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft);margin:0 0 .55em;font-style:normal;letter-spacing:.01em}
.panel .links{font-family:var(--mono);font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:.4em}
.panel .links a{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;text-decoration-color:var(--rule)}
.panel .links a:hover{text-decoration-color:currentColor}
.panel .try{margin:.75em 0 0;padding:.7em 0 .1em;border-top:1px dotted var(--rule);font-style:italic}
.panel .earlier{margin-top:1.6em;color:var(--ink-soft)}
.panel blockquote{margin:1.6em 0;padding:0 0 0 1.1em;border-left:1px solid var(--ink);font-style:italic;font-size:1.06em;line-height:1.55}
.panel .contact a{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px;text-decoration-color:var(--rule)}
.panel .contact a:hover{text-decoration-color:currentColor}
.panel .contact .big{font-style:italic;font-size:clamp(26px,3vw,38px);font-variation-settings:"opsz" 60;font-weight:300;display:inline-block;margin:.2em 0 .6em}

.open .statement{opacity:0;filter:blur(6px);transition:opacity .5s ease,filter .5s ease}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:640px){
  .statement{bottom:calc(62vh + 2.5vh);font-size:clamp(21px,6vw,27px);line-height:1.3}
  .br{gap:18px}
  .chrome{font-size:12px}
}
@media (max-height:520px) and (orientation:landscape){
  .statement{font-size:clamp(15px,4.3vh,22px);line-height:1.25}
}

/* diagnostics, shown only at #diag */
.diag-btn{top:calc(var(--pad) + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%)}
.diag{position:fixed;z-index:7;left:50%;transform:translateX(-50%);top:calc(var(--pad) + env(safe-area-inset-top,0px) + 40px);
  width:min(360px,calc(100vw - 24px));max-height:70vh;overflow:auto;padding:10px 12px;
  font:11px/1.45 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums;
  background:var(--veil);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--rule);border-radius:3px}
.diag-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-2px 0 8px}
.diag-bar span{color:var(--ink-soft)}
.diag-bar button{font:inherit;font-size:12px;color:inherit;background:none;border:1px solid var(--rule);border-radius:3px;padding:0 14px;min-height:36px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
.diag pre,.diag textarea{margin:0;font:inherit;color:inherit;white-space:pre-wrap;word-break:break-word;
  -webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.diag textarea{display:block;box-sizing:border-box;width:100%;margin-top:8px;padding:6px;font-size:16px;line-height:1.35;
  background:transparent;border:1px solid var(--rule);border-radius:3px;resize:vertical}
.diag textarea[hidden]{display:none}
.safe-probe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.diag[hidden],.diag-btn[hidden]{display:none}
</style>
<style>
canvas#sea{opacity:0;transition:opacity 1.6s ease}
body,.chrome,.statement{transition:color 1.2s ease}
.ready .statement{transition:opacity 2.2s ease .35s,filter 2.2s ease .35s,color 1.2s ease}
.gl canvas#sea{opacity:1}
.statement{text-shadow:0 0 34px rgba(230,240,244,.55)}
:root[data-theme="dark"] .statement{text-shadow:0 0 30px rgba(4,19,29,.55)}
</style>

<script>
/* ================= the lagoon: three.js =================
   The water follows CAUSTIC//VOLUME by Scottie (MIT, see licenses/caustic-volume.txt): a choppy JONSWAP FFT sea,
   photon-grid caustics on a sand bed and through a stack of depth slices, light shafts measured against the
   slices' local average, a sky with drifting cumulus, temporal accumulation, a bloom pyramid and AgX. The FFT pass,
   the height-field intersection and the B-spline filter come from Clearwater by Aurélien at Lumaris (MIT, see
   licenses/clearwater.txt). three.js is a thin layer over WebGL2 here: every pass is a RawShaderMaterial drawn into a render target. */
(function(){
const root = document.documentElement;
const noGL = () => root.classList.add("no-gl");
if (!window.THREE) { noGL(); return; }
const canvas = document.getElementById("sea");
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, depth: false, stencil: false, powerPreference: "high-performance" });
} catch (e) { noGL(); return; }
const caps = renderer.capabilities, ext = renderer.extensions;
const F32 = caps.isWebGL2 && ext.has("EXT_color_buffer_float");
if (!caps.isWebGL2 || !(F32 || ext.has("EXT_color_buffer_half_float"))) { renderer.dispose(); noGL(); return; }
renderer.autoClear = false;
renderer.setClearColor(0x000000, 0);

const S = window.A4D_STATE;            // shared with the UI: night (0..1), pointer, open
const HALF = THREE.HalfFloatType, FFT_TYPE = F32 ? THREE.FloatType : HALF;
const ANISO = caps.getMaxAnisotropy();

/* ---------- passes ---------- */
function rt(w, h, type, o = {}){
  const f = o.nearest ? THREE.NearestFilter : THREE.LinearFilter, wrap = o.repeat ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
  return new THREE.WebGLRenderTarget(w, h, { type, depthBuffer: false, magFilter: f, minFilter: o.mip ? THREE.LinearMipmapLinearFilter : f,
    wrapS: wrap, wrapT: o.clampT ? THREE.ClampToEdgeWrapping : wrap, generateMipmaps: !!o.mip, anisotropy: Math.min(o.aniso || 1, ANISO) });
}
const QUAD_VS = `precision highp float;
in vec2 position; out vec2 vUv;
void main(){ vUv = position * 0.5 + 0.5; gl_Position = vec4(position, 0.0, 1.0); }`;
const HEAD = `precision highp float; precision highp sampler2D; precision highp int;
in vec2 vUv; out vec4 o;
`;

// radix-2 FFT over a ping-pong pair, rows then columns; returns the index that holds the result
const mFFT = shader(CMUL + `
uniform sampler2D uSrc; uniform int uP, uHoriz, uHalf;
void main(){

  int k = j & (uP - 1);
  int i = ((j - (j & (2 * uP - 1))) >> 1) + k;
  ivec2 a = uHoriz == 1 ? ivec2(i, id.y) : ivec2(id.x, i);
  ivec2 b = uHoriz == 1 ? ivec2(i + uHalf, id.y) : ivec2(id.x, i + uHalf);
  vec4 x0 = texelFetch(uSrc, a, 0), x1 = texelFetch(uSrc, b, 0);

/* ---------- the look, in one place ---------- */
const LOOK = {
  dbed: 1.1,                                   // depth of the sand bed in front of the viewer (m); it shelves away with distance
  sea: 0.42, chop: 0.85,                       // sea state and choppiness
  sigA: [0.75, 0.11, 0.045],                   // absorption per metre: red goes first, then green
  sigS: [0.012, 0.02, 0.035],                  // scattering per metre: the particles that turn deep water blue
  god: 1.7,                                    // how far the light shafts stand out from their local average
  amb: 0.35,                                   // ambient light under water
  sandLo: [0.78, 0.80, 0.78], sandHi: [0.93, 0.94, 0.91],
  shelf: 0.45,                                 // how fast the bed falls away with distance (m per m)
  fog: 110,                                    // distance at which the water fades into the horizon haze (m)
  sun: [55, 30],                               // elevation, azimuth (degrees, positive to the right)
  glint: 0.04,                                 // angular radius of the sun as the water reflects it (rad): more, softer sparkles
  sky: 1.4,                                    // sky brightness: the sky has to read as the light the water is lit by
  exposure: 1.3, sat: 1.8,
  speed: 1.0                                   // the water's clock against real time; 1 is true speed for these waves

/* ---------- the sea: a JONSWAP spectrum with a cross swell, choppy FFT over a 4.2 m patch ---------- */
const N = 256;
const L = 4.2;                   // patch size (m)
const DBED = LOOK.dbed;

const RMS = 0.003 + SEA * SEA * 0.07 + SEA * 0.012, CHOPK = CHOP * (0.3 + 0.5 * SEA);
const LOOP = 120;                // dispersion is quantised so the surface repeats every 2 minutes

const GL_CONST = `
const int N = ${N};
const float PATCH = ${L.toFixed(2)}, DBED = ${DBED.toFixed(2)}, DVOL = ${DVOL.toFixed(2)}, PI = 3.14159265359;
`;
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function genSpectrum(){
  const r = mulberry(7), windDir = 0.65, peak = 1.25, swell = 0.4, spread = 0.35;
  const re = new Float32Array(N * N), im = new Float32Array(N * N);
  const kp = 2 * Math.PI / peak, kp2 = 2 * Math.PI / (peak * 1.9), cutoff = (L / N) * 1.6, dk = 2 * Math.PI / L;
  const jon = (k, kpk) => { const s = k < kpk ? 0.07 : 0.09; return Math.pow(k, -4) * Math.exp(-1.25 * (kpk / k) ** 2) * Math.pow(3.3, Math.exp(-((k - kpk) ** 2) / (2 * s * s * kpk * kpk))); };
  const dirF = (th, dir, sharp) => Math.pow(Math.abs(Math.cos((th - dir) * 0.5)), sharp);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++){
    const mx = i < N / 2 ? i : i - N, mz = j < N / 2 ? j : j - N, idx = j * N + i;
    if (mx === 0 && mz === 0) continue;
    const kx = mx * dk, kz = mz * dk, k = Math.hypot(kx, kz), th = Math.atan2(kz, kx);
    const D = (1 - spread) * dirF(th, windDir, 12) * 1.9 + spread * 0.32, D2 = dirF(th, windDir + 1.1, 20) * 2.2;

const ocean = [rt(N, N, FFT_TYPE, { nearest: true }), rt(N, N, FFT_TYPE, { nearest: true })];
const dispRT = rt(N, N, HALF, { repeat: true }), heightRT = rt(N, N, HALF, { nearest: true });

// h(k,t) = h0(k) e^{iwt} + conj(h0(-k)) e^{-iwt}, packed with the horizontal displacements: A = h + i Dx, B = Dz
const mSpec = shader(GL_CONST + `
uniform sampler2D uH0; uniform float uT;
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy);
  int mx = c.x < N / 2 ? c.x : c.x - N, mz = c.y < N / 2 ? c.y : c.y - N;

uniform sampler2D uSrc;
void main(){

const mCompose = shader(GL_CONST + `
uniform sampler2D uDisp;
void main(){

  for (int i = 0; i < 5; i++) x0 = xz - textureLod(uDisp, x0 / PATCH, 0.0).yz;
  vec4 d = textureLod(uDisp, x0 / PATCH, 0.0);

// slopes by central differences -> (height, dh/dx, dh/dz, Jacobian)
const mSlopes = shader(GL_CONST + `
uniform sampler2D uH;
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec4 C = texelFetch(uH, c, 0);
  float l = texelFetch(uH, ivec2((c.x + N - 1) % N, c.y), 0).x, r = texelFetch(uH, ivec2((c.x + 1) % N, c.y), 0).x;

}`, { uH: heightRT.texture });
function runSea(t){
  draw(mSpec, ocean[0], { uT: t % LOOP });
  draw(mDisp, dispRT, { uSrc: ocean[fft(ocean, N)].texture });
  draw(mCompose, heightRT);
  draw(mSlopes, surfRT);

/* ---------- caustics: one photon per grid vertex, refracted to a horizontal plane; intensity = area before / after ---------- */
const light = { sun: shared(new THREE.Vector3()), glint: shared(new THREE.Vector3()), col: shared(new THREE.Vector3()), lw: shared(new THREE.Vector3()), flatT: shared(1), causK: shared(1), amb: shared(new THREE.Vector3()) };
function photonGrid(G){
  const g = new THREE.InstancedBufferGeometry();
  const v = new Float32Array((G + 1) * (G + 1) * 2); let o = 0;
  for (let j = 0; j <= G; j++) for (let i = 0; i <= G; i++){ v[o++] = i / G; v[o++] = j / G; }
  const idx = new Uint32Array(G * G * 6); o = 0;
  for (let j = 0; j < G; j++) for (let i = 0; i < G; i++){ const a = j * (G + 1) + i, b = a + 1, c = a + G + 1, d = c + 1; idx[o++] = a; idx[o++] = b; idx[o++] = c; idx[o++] = b; idx[o++] = d; idx[o++] = c; }

  g.setIndex(new THREE.BufferAttribute(idx, 1));
  g.instanceCount = 9;                                           // 3x3 copies so every map tiles seamlessly
  return g;
}
const FRESNEL = `float fresnelDielectric(float cosi, float etai, float etat){
  cosi = clamp(cosi, 0.0, 1.0);
  float sint = etai / etat * sqrt(max(0.0, 1.0 - cosi * cosi));
  if (sint >= 1.0) return 1.0;
  float cost = sqrt(max(0.0, 1.0 - sint * sint));
  float rs = (etat * cosi - etai * cost) / (etat * cosi + etai * cost);
  float rp = (etai * cosi - etat * cost) / (etai * cosi + etat * cost);
  return 0.5 * (rs * rs + rp * rp);
}
`;
function causMaterial(ior, mask, sliceY, lod){

    glslVersion: THREE.GLSL3,
    uniforms: { uSurf: { value: surfRT.texture }, uSun: light.sun, uLw: light.lw, uFlatT: light.flatT,
      uIor: { value: ior }, uMask: { value: new THREE.Vector4(...mask) }, uSliceY: { value: sliceY }, uLod: { value: lod } },
    vertexShader: `precision highp float; precision highp sampler2D;
      ${GL_CONST}
      in vec2 position;
      uniform sampler2D uSurf; uniform vec3 uSun, uLw; uniform float uFlatT, uIor, uSliceY, uLod;
      out vec2 vOld, vNew; out float vW;
      ${FRESNEL}
      void main(){
        vec2 off = vec2(gl_InstanceID % 3 - 1, gl_InstanceID / 3 - 1);
        vec4 s = textureLod(uSurf, position, uLod);               // slopes band-limited to the photon spacing
        vec3 p = vec3(position.x * PATCH, s.x, position.y * PATCH);
        vec3 n = normalize(vec3(-s.y, 1.0, -s.z));
        float ci = dot(n, uSun);
        float T = ci > 0.0 ? (1.0 - fresnelDielectric(ci, 1.0, 1.333)) / uFlatT : 0.0;
        vec3 d = refract(-uSun, n, 1.0 / uIor);
        if (dot(d, d) < 0.5) d = vec3(0.0, -1.0, 0.0);

        vOld = p.xz + uLw.xz * (uSliceY / uLw.y);                // where flat water would have sent it

function causScene(geo, mats){

  return sc;

// the bed: one map per colour channel, each refracted with its own index (dispersion)
const FLOOR_RES = 1024;
const floorRT = rt(FLOOR_RES, FLOOR_RES, HALF, { repeat: true, mip: true, aniso: 8 });
const floorScene = causScene(photonGrid(192), [[1.3310, [1, 0, 0, 0]], [1.3340, [0, 1, 0, 0]], [1.3380, [0, 0, 1, 0]]]
  .map(([ior, m]) => causMaterial(ior, m, -DBED, 0.0)));

const SLICES = 8, SLICE_RES = 256;
const sliceRT = [0, 1].map(() => rt(SLICE_RES, SLICE_RES, HALF, { repeat: true, mip: true }));
const sliceGeo = photonGrid(96);
const sliceScenes = [0, 1].map(r => causScene(sliceGeo, [0, 1, 2, 3].map(c => {
  const k = r * 4 + c; return causMaterial(1.333, [0, 1, 2, 3].map(i => +(i === c)), -DVOL * k / (SLICES - 1), 1.4);
})));

/* ---------- sky: gradient, haze band, drifting cumulus; baked into an environment map for reflections ---------- */
const SKY_GLSL = `
uniform vec3 uSun, uSunCol, uGlint; uniform float uNight, uTime;
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float hash13(vec3 p3){ p3 = fract(p3 * 0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){

  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y);
}
float vnoise3(vec3 p){
  vec3 i = floor(p), f = fract(p); vec3 u = f * f * (3.0 - 2.0 * f);
  float a = mix(mix(hash13(i), hash13(i + vec3(1, 0, 0)), u.x), mix(hash13(i + vec3(0, 1, 0)), hash13(i + vec3(1, 1, 0)), u.x), u.y);
  float b = mix(mix(hash13(i + vec3(0, 0, 1)), hash13(i + vec3(1, 0, 1)), u.x), mix(hash13(i + vec3(0, 1, 1)), hash13(i + vec3(1, 1, 1)), u.x), u.y);

}
float fbm2(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 6; i++){ s += a * vnoise(p); p = mat2(1.6, 1.2, -1.2, 1.6) * p; a *= 0.5; } return s; }
// a cumulus bank on the horizon: towers by azimuth, billowed edges, sunlit tops and blue-grey bases
vec4 cumulusBank(vec3 d){
  float e = d.y;
  if (e > 0.13 || e < -0.01) return vec4(0.0);
  float az = atan(d.x, -d.z) + uTime * 0.0012;
  float big = vnoise(vec2(az * 2.2, 3.7)) * 0.55 + vnoise(vec2(az * 5.3, 9.1)) * 0.3 + vnoise(vec2(az * 13.0, 1.3)) * 0.15;
  float H = 0.012 + 0.095 * pow(smoothstep(0.28, 0.78, big), 1.2);
  vec2 q = vec2(az, e) * 62.0;
  float bill = fbm2(q);
  float m = smoothstep(0.0, 0.0035, H + 0.02 * (bill - 0.5) - e);
  float t = clamp(e / max(H, 1e-3), 0.0, 1.0);
  float lit = clamp(0.2 + 1.0 * t + 0.9 * (fbm2(q * 1.7 + 4.0) - 0.45), 0.0, 1.0);
  return vec4(vec3(lit), m);
}
vec3 skyRadiance(vec3 d){

  float sunH = uSun.y, y = max(d.y, 0.0), mu = dot(d, s), m = max(mu, 0.0);
  // a clear summer sky: deep cyan-blue overhead, paling toward a bright horizon
  vec3 zen = mix(vec3(0.010, 0.040, 0.160), vec3(0.006, 0.240, 0.700), smoothstep(-0.05, 0.45, sunH));
  vec3 mid = vec3(0.050, 0.460, 0.900);
  vec3 hor = mix(vec3(0.520, 0.300, 0.160), vec3(0.540, 0.790, 0.980), smoothstep(-0.02, 0.35, sunH));
  vec3 tint = mix(vec3(1.0, 0.55, 0.25), vec3(1.0, 0.96, 0.90), smoothstep(0.0, 0.4, sunH));

  zen = mix(zen, vec3(0.0016, 0.0050, 0.0140), uNight);
  mid = mix(mid, vec3(0.0040, 0.0120, 0.0300), uNight);
  hor = mix(hor, vec3(0.010, 0.029, 0.050), uNight);

    float n = fbm2(cp * vec2(1.0, 1.6));

    float wisp = smoothstep(0.55, 0.85, fbm2(cp * vec2(0.6, 3.2) + 9.0)) * 0.45 * smoothstep(0.05, 0.3, d.y);

  // the glint sun sits a little above the top edge, so its glitter path crosses the water and its disc never shows
  toward(glintDay, GLINT_EL, 4);
  mWater.uniforms.uPixAng.value = 2 * Math.tan(camera.fov * Math.PI / 360) / H;
}
const sunColDay = new THREE.Vector3(1.0, 0.95, 0.88).multiplyScalar(5.0);
const moonCol = new THREE.Vector3(0.62, 0.78, 0.95).multiplyScalar(0.4);
frame();
addEventListener("resize", frame, { passive: true });

// lighting derived from the light's direction: refracted beam, flat-water transmission, ambient light under water
const fresnelJS = c => { const s = Math.sqrt(Math.max(0, 1 - c * c)) / 1.333; if (s >= 1) return 1; const ct = Math.sqrt(1 - s * s);
  const rs = (1.333 * c - ct) / (1.333 * c + ct), rp = (c - 1.333 * ct) / (c + 1.333 * ct); return 0.5 * (rs * rs + rp * rp); };
const SIG = [0, 1, 2].map(i => [LOOK.sigA[i], LOOK.sigS[i]]);
function lighting(n){
  const s = light.sun.value.copy(sunDay).lerp(moon, n).normalize(), col = light.col.value.copy(sunColDay).lerp(moonCol, n);
  light.glint.value.copy(glintDay).lerp(moon, n).normalize();
  const ci = s.y, eta = 1 / 1.333, k = 1 - eta * eta * (1 - ci * ci);
  const lw = light.lw.value.set(-s.x * eta, -s.y * eta + (eta * ci - Math.sqrt(k)), -s.z * eta).normalize();
  const Tflat = 1 - fresnelJS(Math.max(ci, 0.02));
  light.flatT.value = Tflat;
  light.causK.value = Tflat * Math.max(ci, 0.02) / Math.max(-lw.y, 0.05);
  const sky = [0.36, 0.54, 0.86].map((c, i) => c * (1 - n) + [0.010, 0.026, 0.050][i] * n).map(c => c * Math.PI * 0.72);
  light.amb.value.set(...[0, 1, 2].map(i => (sky[i] * 0.75 + col.getComponent(i) * Math.max(ci, 0) * light.causK.value * 0.22) * Math.exp(-(SIG[i][0] + SIG[i][1]) * 0.9) * 1.1 * LOOK.amb));
}

/* Frames are capped at 30 a second (15 under a panel). The target: the GPU finishes each frame in under about
   55% of that budget. A fence after every frame tells how long the GPU took; resolution steps down when a frame
   is still running as the next one is due, and creeps back up after three seconds of comfortable frames. */
const FRAME_MS = 1000 / 30, gl = renderer.getContext();
let clock = 0, lastDraw = -1, nextDraw = 0, running = true, shown = false, frameNo = 0, raf = 0;
let fence = null, fenceT = 0, gpuMs = 0, overN = 0, underN = 0;
let envAt = -1, envNight = -1;
document.addEventListener("visibilitychange", () => {
  running = !document.hidden && !root.classList.contains("no-gl");
  if (running){ lastDraw = -1; nextDraw = 0; cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); }
});
const yaw = { v: 0 }, pitch = { v: 0 };
function tick(now){
  if (!running) return;
  raf = requestAnimationFrame(tick);
  if (fence && gl.getSyncParameter(fence, gl.SYNC_STATUS) === gl.SIGNALED){ gpuMs = now - fenceT; gl.deleteSync(fence); fence = null; }
  // pace against a running target, so any refresh rate averages 30 frames a second
  const interval = (S.open ? 2 : 1) * FRAME_MS;
  if (now < nextDraw - 2) return;
  nextDraw = now - nextDraw > interval ? now + interval : nextDraw + interval;
  if (fence && now - fenceT > 1000){ gl.deleteSync(fence); fence = null; }          // a fence that never signals tells nothing
  if (!S.open){
    if (fence){ overN++; underN = 0; }
    else if (gpuMs < FRAME_MS * 0.55){ underN++; overN = Math.max(0, overN - 1); }
    else { underN = 0; overN = Math.max(0, overN - 1); }
    if (overN > 8 && quality > 0.5){ quality = Math.max(0.5, quality * 0.85); overN = 0; frame(); }
    else if (underN > 90 && quality < 1.0){ quality = Math.min(1.0, quality * 1.08); underN = 0; frame(); }
  }
  // the clock follows real elapsed time, so the water moves at the same pace at any frame rate
  if (lastDraw < 0) lastDraw = now - FRAME_MS;
  const real = Math.min(0.5, (now - lastDraw) / 1000), dt = Math.min(0.1, real);
  lastDraw = now;

  clock += real * LOOK.speed;
  S.stats.frames++; S.stats.real = real; S.stats.clock = clock; S.stats.gpuMs = gpuMs;
  S.night += (S.targetNight - S.night) * Math.min(1, dt * 1.4);
  const n = S.night, t = clock + 30.0;
  lighting(n);

  // the pointer turns the head a little; a slow handheld drift keeps the frame alive
  yaw.v += ((-S.pointer[0]) * 0.035 - yaw.v) * Math.min(1, dt * 1.1);
  pitch.v += ((-S.pointer[1]) * 0.012 - pitch.v) * Math.min(1, dt * 1.1);
  camera.position.set(0.03 * Math.sin(t * 0.21), EYE + 0.015 * Math.sin(t * 0.57), 0.03 * Math.cos(t * 0.17));
  camera.rotation.set(basePitch + pitch.v + 0.004 * Math.sin(t * 0.47 + 2.0) + 0.002 * Math.sin(t * 1.13),
                      yaw.v + 0.010 * Math.sin(t * 0.31) + 0.005 * Math.sin(t * 0.83 + 1.3), 0.004 * Math.sin(t * 0.39 + 0.4), "YXZ");
  camera.updateMatrixWorld();
  camRot.setFromMatrix4(camera.matrixWorld);

  runSea(t);
  if (t - envAt > 0.5 || Math.abs(n - envNight) > 0.01){ draw(mEnv, envRT, { uNight: n, uTime: t }); envAt = t; envNight = n; }
  renderCaustics();
  draw(mWater, hdrRT, { uTime: t, uNight: n });
  post(n, frameNo);
  frameNo++;

  if (!fence){ fence = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0); gl.flush(); fenceT = now; }

  if (!shown){
    // a shader that failed to build leaves the plain gradient in place rather than a broken frame
    if (renderer.info.programs.some(p => p.diagnostics && !p.diagnostics.runnable)){ running = false; noGL(); return; }
    shown = true; root.classList.add("gl");
  }
}
raf = requestAnimationFrame(tick);
})();

</script>
<script>
/* ---------------- diagnostics: anghel4d.com/#diag ----------------
   The device, the render settings, the frame rate and the water clock, and a test of the glint maths on this
   GPU, with a copy button. Off unless the address ends in #diag (or A4D_DIAG is set), so visitors pay nothing.
   The controls exist in both languages; the readout is data in one fixed format, so readouts compare line by line. */
(function(){
let on = false;
function start(){
  if (on) return; on = true;
  const S = window.A4D_STATE, panel = document.getElementById("diag"), out = document.getElementById("diagText"), btn = document.getElementById("diagBtn");
  const copyBtn = document.getElementById("diagCopy"), note = document.getElementById("diagNote"), fall = document.getElementById("diagFall");
  document.getElementById("diagCtl").hidden = false; panel.hidden = false;
  btn.addEventListener("click", () => { panel.hidden = !panel.hidden; btn.setAttribute("aria-expanded", String(!panel.hidden)); });
  const labels = () => { panel.setAttribute("aria-label", T[lang].diagLabel); fall.setAttribute("aria-label", T[lang].diagText); };
  labels(); document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", labels));
  // the GPU, its limits, and the glint-disc maths run on it (a separate tiny context, so the scene is untouched)
  const gpu = {}, maths = [];
  try {
    const c = document.createElement("canvas"); c.width = 1; c.height = 1;
    const gl = c.getContext("webgl2", { antialias: false });
    const dbg = gl.getExtension("WEBGL_debug_renderer_info"), an = gl.getExtension("EXT_texture_filter_anisotropic");
    gpu.renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    gpu.vendor = dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR);
    gpu.ext = ["EXT_color_buffer_float", "EXT_color_buffer_half_float", "OES_texture_float_linear", "EXT_float_blend"].filter(e => gl.getExtension(e)).join(" ");
    gpu.aniso = an ? gl.getParameter(an.MAX_TEXTURE_MAX_ANISOTROPY_EXT) : 0;
    const hp = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT); gpu.highp = hp.precision;
    const vs = "#version 300 es\nin vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }";
    // 64 angles a = 0.0005 .. 0.0635 rad across the glint disc (r = 0.04: its soft edge runs from 0.032 to 0.048)
    const fs = `#version 300 es
precision highp float; out vec4 o; uniform float uR; uniform vec3 uG;
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy);
  float a = (float(c.x) + 0.5) * 0.001;
  vec3 d = normalize(vec3(sin(a) * 0.3, cos(a), sin(a) * 0.9539392014));   // a direction at angle a from uG
  float ang = acos(clamp(dot(d, uG), -1.0, 1.0));                         // as the water shader does it
  float v;
  if (c.y == 0) v = acos(cos(a));
  else if (c.y == 1) v = ang;
  else if (c.y == 2) v = smoothstep(uR * 1.2, uR * 0.8, ang);             // the disc as written: reversed edges
  else v = 1.0 - smoothstep(uR * 0.8, uR * 1.2, ang);                     // the same disc with ordered edges
  o = vec4(v, 0.0, 0.0, 1.0);
}`;
    const sh = (t, src) => { const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s); return s; };
    const pg = gl.createProgram(); gl.attachShader(pg, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pg, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pg);
    if (!gl.getProgramParameter(pg, gl.LINK_STATUS)) throw new Error("test shader did not link");
    gl.useProgram(pg);
    const W = 64, H = 4, f32 = !!gl.getExtension("EXT_color_buffer_float");
    if (f32){   // read the results back as 32-bit floats
      const tx = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tx); gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA32F, W, H);
      gl.bindFramebuffer(gl.FRAMEBUFFER, gl.createFramebuffer()); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tx, 0);
    } else { c.width = W; c.height = H; }
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.uniform1f(gl.getUniformLocation(pg, "uR"), 0.04); gl.uniform3f(gl.getUniformLocation(pg, "uG"), 0, 1, 0);
    gl.viewport(0, 0, W, H); gl.drawArrays(gl.TRIANGLES, 0, 3);
    let px;
    if (f32){ px = new Float32Array(W * H * 4); gl.readPixels(0, 0, W, H, gl.RGBA, gl.FLOAT, px); }
    else { const b8 = new Uint8Array(W * H * 4); gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, b8); px = Float32Array.from(b8, v => v / 255); }
    const ss = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };
    const ref = [x => x, x => x, x => 1 - ss(0.032, 0.048, x), x => 1 - ss(0.032, 0.048, x)];
    const names = ["acos(cos a)", "shader angle", "disc as written", "disc ordered"];
    maths.push("maths  readback " + (f32 ? "float32" : "8-bit") + ", 64 angles 0..0.064 rad, max error:");
    for (let y = 0; y < H; y++){
      let err = 0, at = 0;
      for (let x = 0; x < W; x++){ const a = (x + 0.5) * 0.001, e = Math.abs(px[(y * W + x) * 4] - ref[y](a)); if (e > err){ err = e; at = a; } }
      maths.push("  " + names[y].padEnd(16) + err.toExponential(2) + " at " + at.toFixed(4));
    }
    const pick = y => [28, 32, 36, 40, 44, 48].map(i => px[(y * W + i) * 4].toFixed(3)).join(" ");
    maths.push("  disc at .0285 .0325 .0365 .0405 .0445 .0485");
    maths.push("  written " + pick(2)); maths.push("  ordered " + pick(3));
  } catch (e) { maths.push("maths test failed: " + e.message); }
  const probe = getComputedStyle(document.getElementById("safeProbe"));
  let lastF = 0, lastC = 0, lastT = performance.now(), fps = 0, rate = 0;
  function draw(){
    const st = S.stats || {}, now = performance.now(), dtw = (now - lastT) / 1000;
    if (st.frames != null && dtw > 0){ fps = (st.frames - lastF) / dtw; rate = (st.clock - lastC) / dtw; lastF = st.frames; lastC = st.clock; lastT = now; }
    const c = document.getElementById("sea").getBoundingClientRect(), vv = window.visualViewport;
    const mm = matchMedia("(prefers-reduced-motion: reduce)").matches;
    latest = [
      "page   " + innerWidth + "x" + innerHeight + " css, dpr " + devicePixelRatio + ", screen " + screen.width + "x" + screen.height,
      "visual " + (vv ? Math.round(vv.width) + "x" + Math.round(vv.height) + " top " + Math.round(vv.offsetTop) + " scale " + vv.scale.toFixed(2) : "n/a"),
      "safe   top " + probe.paddingTop + " bottom " + probe.paddingBottom,
      "canvas " + Math.round(c.width) + "x" + Math.round(c.height) + " css at y " + Math.round(c.top) + ", buffer " + (st.buffer || []).join("x"),
      "render pr " + (st.pr || 0).toFixed(3) + ", quality " + (st.quality || 0).toFixed(3) + ", fov " + st.fov + ", aspect " + (st.aspect || 0).toFixed(3),
      "frames " + fps.toFixed(1) + " fps, water clock x" + rate.toFixed(2) + " of real time, gpu " + Math.round(st.gpuMs || 0) + " ms",
      "resize calls " + st.resizes + ", float32 targets " + st.f32 + ", reduced motion asked " + mm,
      "ua     " + navigator.userAgent,
      "gpu    " + gpu.renderer + " (" + gpu.vendor + ")",
      "ext    " + gpu.ext + ", aniso " + gpu.aniso + ", highp bits " + gpu.highp,
      ...maths
    ].join("\n");
    if (!selecting()) out.textContent = latest;   // rewriting the text would drop a selection in progress
  }
  // hold the text still while a finger is on it or part of it is selected
  let latest = "", touching = false;
  out.addEventListener("pointerdown", () => { touching = true; });
  addEventListener("pointerup", () => { touching = false; }); addEventListener("pointercancel", () => { touching = false; });
  function selecting(){
    const s = getSelection();
    return touching || !!(s && !s.isCollapsed && s.rangeCount && out.contains(s.getRangeAt(0).commonAncestorContainer));
  }
  // copy: execCommand on a selected, read-only textarea first. It runs synchronously inside the tap, which WebKit
  // needs, and works in frames that block the async clipboard. Then navigator.clipboard, still inside the tap.
  // If neither takes, the text appears in a box, selected, to copy by hand.
  function viaExec(text){
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", "");                       // read-only: no iOS keyboard
    ta.style.cssText = "position:fixed;top:0;left:-9999px;font-size:16px;border:0;padding:0;margin:0";   // 16px: no iOS zoom
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);                     // iOS needs the explicit range
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove(); getSelection().removeAllRanges();
    try { copyBtn.focus({ preventScroll: true }); } catch (e) {}
    return ok;
  }
  let noteT = 0;
  function say(t){ note.textContent = t; clearTimeout(noteT); noteT = setTimeout(() => { note.textContent = T[lang].diagLive; }, 2500); }
  function byHand(text){
    fall.value = text; fall.hidden = false;
    fall.focus({ preventScroll: true }); fall.select(); fall.setSelectionRange(0, text.length);
    say(T[lang].diagBlocked);
  }
  copyBtn.addEventListener("click", () => {
    const text = latest;
    if (viaExec(text)){ say(T[lang].diagCopied); return; }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(() => say(T[lang].diagCopied), () => byHand(text));
    } else byHand(text);
  });
  draw(); setInterval(draw, 1000);
}
if (window.A4D_DIAG || location.hash === "#diag") start();
addEventListener("hashchange", () => { if (location.hash === "#diag") start(); });
})();
</script>
